// ===== battle animation =====
function fEl(s,i){ return document.querySelector(`#battle .fighter[data-s="${s}"][data-i="${i}"]`); }
function fCenter(el){ const r=el.querySelector('.fart').getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height*0.5]; }
function animateBattle(root,b,animating){
  const evs=b.ev||[]; const actE=evs.find(e=>e.k==='act'); const sk=actE&&SK[actE.sk]; const actIdx=actE?evs.indexOf(actE):-1;
  let T=0;
  if(actE && animating){
    const ac=fEl(actE.s,actE.i); const left = actE.s===B.mySide;
    const nm=document.createElement('div'); nm.className='castname '+(left?'l':'r'); nm.textContent=sk.n; root.appendChild(nm); setTimeout(()=>nm.remove(),1300);
    const acf=fEl(actE.s,actE.i); if(acf){ acf.classList.add('casting'); setTimeout(()=>acf.classList.remove('casting'),1300); }
    const hits=evs.filter(e=>e.k==='hit' && e.s!==actE.s);
    const ranged = sk.pow && sk.el!=='neutral';
    if(ac) ac.classList.add(sk.pow&&!ranged?(left?'dash-r':'dash-l'):sk.pow?(left?'lunge-r':'lunge-l'):'cast');
    if(ac && !sk.pow && sk.t==='self'){ const sw=document.createElement('i'); sw.className='swoosh '+(left?'l':'r'); ac.appendChild(sw); setTimeout(()=>sw.remove(),900); }
    if(ranged && ac){
      T=520; const [x0,y0]=fCenter(ac); const seen=new Set();
      hits.forEach(h=>{ const key=h.s+'-'+h.i; if(seen.has(key)) return; seen.add(key); const tc=fEl(h.s,h.i); if(!tc) return; const [x1,y1]=fCenter(tc);
        const p=document.createElement('div'); p.className='proj'+(sk.el==='bolt'?' bolt':''); p.style.setProperty('--c',EL[sk.el].c); p.style.left=x0+'px'; p.style.top=y0+'px';
        if(sk.el==='bolt') p.style.rotate=(Math.atan2(y1-y0,x1-x0)*180/Math.PI+90)+'deg';
        document.body.appendChild(p); setTimeout(()=>{ p.style.transform=`translate(${x1-x0}px,${y1-y0}px)`; },170); setTimeout(()=>p.remove(),520); });
    } else T = sk.pow?260:300;
  }
  if(animating){ evSchedule(b,T); evs.forEach(e=>{
    if(e.k==='act'||e.k==='enter') return;
    if(e.k==='miss'){ e.k='buff'; e.b='evade'; e.missed=1; }
    if(e.k==='dot'&&e._fx!=null) setTimeout(()=>{ const el=fEl(e.s,e.i); if(!el||!B||B.b!==b) return; dotIntro(el,e,b); }, e._fx);
    setTimeout(()=>{
      const el=fEl(e.s,e.i); if(!el||!B||B.b!==b) return;
      evLand(b,e);
      if(e.k==='buff'&&!e.missed){ const r=document.createElement('i'); r.className='ring2'; r.style.setProperty('--c', (ST_ICON[e.b]||['','#5e8bff'])[1]); el.appendChild(r); setTimeout(()=>r.remove(),800); syncFighter(b,e.s,e.i); return; }
      const f=document.createElement('span'); f.className='float2 '+e.k+(e.crit?' crit':'');
      f.textContent = (e.k==='heal'||e.k==='mana')?(e.v<0?`${e.v}`:`+${e.v}`): e.k==='buff'?'Missed!': e.k==='stun'?'Stunned!': `-${e.v}`;
      if(e.k==='shield'){ syncFighter(b,e.s,e.i); return; }
      if(e.k==='hit'||e.k==='dot'){
        el.classList.remove('shake','hitflash'); void el.offsetWidth; el.classList.add('shake','hitflash'); setTimeout(()=>el.classList.remove('hitflash','shake'),460);
        const [x,y]=fCenter(el); const bu=document.createElement('div'); bu.className='burst'; bu.style.setProperty('--c',EL[e.el]?EL[e.el].c:'#fff'); bu.style.left=x+'px'; bu.style.top=y+'px'; document.body.appendChild(bu); setTimeout(()=>bu.remove(),460);
        if(e.eff==='up'){ const x2=document.createElement('span'); x2.className='eff2'; x2.textContent='Super effective!'; el.appendChild(x2); setTimeout(()=>x2.remove(),1500); }
        if(e.crit){ const c=document.createElement('span'); c.className='eff2 crit'; c.textContent='Critical!'; el.appendChild(c); setTimeout(()=>c.remove(),1500); root.classList.remove('quake'); void root.offsetWidth; root.classList.add('quake'); }
      }
      if(e.k==='heal'){ for(let n=0;n<7;n++){ const s=document.createElement('i'); s.className='sparkle'; s.style.left=(15+Math.random()*70)+'%'; s.style.animationDelay=(n*0.07)+'s'; el.appendChild(s); setTimeout(()=>s.remove(),1300);} }
      el.appendChild(f); setTimeout(()=>f.remove(),1500);
      syncFighter(b,e.s,e.i);
    }, e._d);
  }); }
  const fin=()=>{ if(!B||B.b!==b) return; if(B.pend) B.pend=new Map(); if(B.hideSt) B.hideSt=new Map(); b.sides.forEach((sd,s)=>sd.mons.forEach((m,i)=>syncFighter(b,s,i))); syncHud(b); };

function finishBattle(){
  if(!B) return; const b=B.b; const mode=B.mode; const meta=B.meta;
  if(B.net) NET.leaveMatch();
  if(mode==='local'){ closeBattle(); return; }
  const win = b.over && b.winner===B.mySide;
  if(mode==='campaign' && meta.task!=null){
    const zi=meta.zi, k=meta.task; const t=taskList(zi)[k]; const m=monBy(meta.uid); const z=ZONES[zi];
    let cash=0, xp=0, mush=0; const extra=[]; let partial=false, zoneJust=false;
    if(win){ S.stats.wins++; const pr=taskProg(zi); pr[k]=Math.min(t.reps,pr[k]+1); if(pr[k]>=t.reps){ cash=t.cash; xp=t.xp; } else partial=`${pr[k]} / ${t.reps}`;
      if(t.t==='boss'){ if((S.zones[z.id]||0)<4){ S.zones[z.id]=4; zoneJust=true; }
        // every run's boss rewards one of the zone's monsters
        if(zi>0){ const pool=SP.filter(x=>x.fam===z.fam); // each of the zone's monsters has an equal chance
          const nm=addMon(pool[Math.floor(Math.random()*pool.length)].id, Math.max(2,z.lv)); if(S.team.length<3) S.team.push(nm.uid); extra.push([`You found a new monster!`,nm]); } }
    }
    S.cash=(S.cash|0)+cash; S.mush+=mush;
    const all=xp?teamXp(xp,m):(m?[{m,r:null}]:[]); const r=all.length?all[0].r:null;
    persist(); closeBattle(); openTasks(zi);
    const tutDone = S.tut===3 && win; if(tutDone){ S.tut=4; persist(); }
    if(partial&&!tutDone){ toast(`Victory! ${partial}`); return; }
    rewardPopup({title:win?'VICTORY!':'DEFEAT', lose:!win, cash, xp, mush, mons:all, onClose:async()=>{
      if(zoneJust) await zoneCompleteScreen(zi);
      for(const [tt,mm] of extra){ await new Promise(res=>{ const s=reveal2(mm,tt,res); }); }
      if(tutDone){ await lilaSay(["See? It's that easy!","Next, let's visit the shop and pick up some mana wood. It gives your monster more mana!"]); S.tut=5; persist(); if(TASKSH) TASKSH.sh.close(); setTimeout(()=>pointAt('[data-p="shop"]'),400); }
      showLevelUps();
    }});
    return;
  }
  const foeSide=1-B.mySide; const avg=b.sides[foeSide].mons.reduce((t,m)=>t+m.lvl,0)/b.sides[foeSide].mons.length;
  let xp=Math.round((15+avg*7)*(win?1:0.3)), cash=0, mush=0;
  if(win){ S.stats.wins++; S.stats.arenaWins++; if(mode==='rival'){ cash=Math.round(20+avg*6); } else if(mode==='pvp'){ cash=Math.round(40+avg*8); S.stats.pvpWins++; xp=Math.round(xp*1.3); } }
  S.cash=(S.cash|0)+cash; S.mush+=mush;
  const res=teamXp(xp);
  persist(); closeBattle();
  rewardPopup({title:win?'VICTORY!':'DEFEAT', lose:!win, cash, xp, mush, mons:res, onClose:showLevelUps});
}

// ===== monster model =====
function ensureMon(m){
  if(!m.pts){ m.pts={atk:0,hp:0,mp:0}; m.free=(m.free|0)||(m.lvl-1)*5; }
  if(!m.eq) m.eq=[null,null,null,null,null];
  if(!m.skl) m.skl={};
  return m;
}
function eqSlots(m){ return m.lvl>=20?5: m.lvl>=10?4:3; }
function monBonus(m){
  ensureMon(m); const b={atk:m.pts.atk*PT.atk, hp:m.pts.hp*PT.hp, mp:m.pts.mp*PT.mp, spd:0};
  m.eq.forEach(id=>{ if(id&&ITEMS[id]){ Object.entries(ITEMS[id].b||{}).forEach(([k,v])=>b[k]=(b[k]||0)+v); Object.entries(ITEMS[id].fx||{}).forEach(([k,v])=>b[k]=(b[k]||0)+v); } });
  return b;
}
function monStats(m){ const s=statsOf(m.sp,m.lvl), b=monBonus(m); return {hp:s.hp+b.hp, atk:s.atk+b.atk, mp:s.mp+b.mp, spd:Math.round((s.spd+b.spd)*10)/10}; }
function snapOf(m){ ensureMon(m); const skl={}; SPI[m.sp].sk.forEach(id=>skl[id]=m.skl[id]||1); return {sp:m.sp, lvl:m.lvl, uid:m.uid, bonus:monBonus(m), skl, items:(m.eq||[]).filter(id=>id&&ITEMS[id])}; }
function mySnap(){ return teamMons().map(snapOf); }
function teamPower(){ return teamMons().reduce((t,m)=>{ const s=monStats(m); return t+Math.round(s.hp*0.4+s.atk*3); },0); }
function sanitizeTeam(t){ return (Array.isArray(t)?t:[]).slice(0,3).filter(m=>m&&SPI[m.sp]&&SPI[m.sp].fam!=='dummy').map(m=>{ const lvl=Math.max(1,Math.min(MAXLVL,m.lvl|0)); const b=m.bonus||{};
  const cl=(v,mx)=>Math.max(0,Math.min(mx,v|0)); const skl={}; Object.keys(m.skl||{}).forEach(k=>{ if(SK[k]) skl[k]=Math.max(1,Math.min(MAXSKL,m.skl[k]|0)); });
  const sk2={}; SPI[m.sp].sk.forEach(id=>sk2[id]=skl[id]||1); return {sp:m.sp, lvl, bonus:{atk:cl(b.atk,lvl*10+40), hp:cl(b.hp,lvl*40+160), mp:cl(b.mp,lvl*40+160), spd:Math.max(0,Math.min(5,+b.spd||0)), rmp:cl(b.rmp,80), rhp:cl(b.rhp,70), dflat:cl(b.dflat,140), tflat:cl(b.tflat,70), belem:cl(b.belem,100), bphys:cl(b.bphys,100), dnat:cl(b.dnat,125), dwat:cl(b.dwat,125), dfir:cl(b.dfir,125)}, skl:sk2, items:(Array.isArray(m.items)?m.items:[]).filter(id=>ITEMS[id]).slice(0,4)}; }); }

let LVQ=[];
function giveXp(m, amt){
  ensureMon(m);
  if(m.lvl>=MAXLVL) return {lv:0,evo:false};
  const st0=stageOf(m.lvl), l0=m.lvl; m.xp+=amt;
  while(m.lvl<MAXLVL && m.xp>=xpNeed(m.lvl)){ m.xp-=xpNeed(m.lvl); m.lvl++; }
  if(m.lvl>=MAXLVL) m.xp=0;
  const gained=m.lvl-l0; if(gained>0){ m.free+=gained*5; if(!LVQ.includes(m.uid)) LVQ.push(m.uid); }
  const evo = stageOf(m.lvl)>st0; if(evo) S.stats.evolves++;
  return {lv:gained, evo};
}
function addMon(sp,lvl){ const m=ensureMon({uid:uidGen(), sp, lvl, xp:0}); m.free=(lvl-1)*5; S.mons.push(m); return m; }
function showLevelUps(){
  if(!LVQ.length) return;
  const uid=LVQ.shift(); const m=monBy(uid); if(!m) return showLevelUps();
  const sp=SPI[m.sp];
  const sh=sheet(`<div class="lvup"><div class="lvup-t">LEVEL UP!</div><div class="lvup-row"><div class="lvup-mon">${monSVG(m.sp,m.lvl)}</div><div><div class="lvup-l"><span class="lvb">${m.lvl}</span> Level ${m.lvl}</div><p>Your ${sp.n} leveled up! Open its profile to spend <b>${m.free} stat points</b>.</p></div></div>
    <button class="btn gbtn" id="vp">View profile</button></div>`,{cls:'reward lvl', onClose:()=>setTimeout(showLevelUps,250)});
  sh.body.querySelector('#vp').onclick=()=>{ sh.close(); LVQ=[]; setTimeout(()=>openMon(uid),300); };
}

function upCost(sl){ return 40*sl*sl; }
function upNeed(sl){ return 3*sl-2; }

    <div class="eslots">${[0,1,2,3,4].map(i=>{ const id=m.eq[i]; if(i>=es) return `<div class="eslot lock"><span>🔒</span><em>Lv ${i===3?10:20}</em></div>`;

function pickItem(m,slot){

  let sel=cur||null;

      ${cur?`<button class="pitem ${sel===null?'sel':''}" data-pi="">${'<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#e57373" stroke-width="6"/><path d="M16 48 48 16" stroke="#e57373" stroke-width="6"/></svg>'}<b>Unequip</b><span>Take it off</span></button>`:''}
      ${!ids.length&&!cur?'<p class="muted center" style="grid-column:1/-1">You don\'t have any items yet.</p>':''}</div>
    <div class="actions"><button class="btn gbtn" id="psel">Select</button></div></div>`);
  sh.body.querySelectorAll('[data-pi]').forEach(x=>x.onclick=()=>{ sel=x.dataset.pi||null; sh.body.querySelectorAll('[data-pi]').forEach(y=>y.classList.toggle('sel',y===x)); });
  sh.body.querySelector('#toshop').onclick=()=>{ sh.close(); MONSH&&MONSH.sh.close(); openShop({m,slot}); };

    if(sel && ITEMS[sel].lv>m.lvl) return toast(`Needs Lv ${ITEMS[sel].lv}`);

  };
}

function hatch(){
  if(S.mush<10){ toast('You need 10 🍄'); return; }

// ===== boot =====
async function boot(){
  S = Object.assign(freshSave(), loadLocal()||{});
  S.stats=Object.assign(freshSave().stats, S.stats||{});
  if(S.cash==null) S.cash=50; if(S.tut==null) S.tut = S.name?99:0; S.inv=S.inv||{};
  S.mons.forEach(ensureMon); try{ fixTeam(); }catch(_){}
  document.querySelectorAll('#bar [data-p]').forEach(b=>b.onclick=()=>openPanel(b.dataset.p));
  render();
  setInterval(()=>{ if(!S) return; const e=S.energy; tickEnergy(); if(e!==S.energy) persist(); if(!B){ renderHUD(); } },1000);
  initDb().then(()=>{ S.mons.forEach(ensureMon); try{ fixTeam(); }catch(_){} if(S.cash==null) S.cash=50; S.inv=S.inv||{}; });
  NET.init();
  await splash();
  if(!S.name) onboarding();
}
boot();

// ===== V5: arena flow — intro, picks, one-at-a-time, swap, timers, rank =====
const PICK_SECS=10, TURN_SECS=10;
function turnKey(b){ return b?[b.phase,b.round,b.turnIdx,b.pickSide,(b.pickQ||[]).length,b.over].join(':'):''; }
function stampIfNewTurn(){ if(!B||!B.b) return; const k=turnKey(B.b); if(k!==B.tkey){ B.tkey=k; B.stamp=Date.now(); } }
const RANKS=[[0,'Bronze','#b07a4a',1],[1200,'Silver','#b8c0cc',2],[1600,'Gold','#f2c14e',2],[2000,'Platinum','#7fd6d6',3],[2500,'Emerald','#3fcf7a',3],[3000,'Diamond','#8fb8ff',4]];
function rankOf(r){ let t=RANKS[0]; RANKS.forEach(x=>{ if(r>=x[0]) t=x; }); return t; }
function rankBadge(r,size){ const [,n,c,k]=rankOf(r); size=size||26;
  let p=''; for(let i=0;i<k;i++){ const y=18-i*5; p+=`<path d="M3 ${y} L12 ${y-6} L21 ${y} L21 ${y+4} L12 ${y-2} L3 ${y+4}Z" fill="${c}" stroke="#1a1a1a" stroke-width="1"/>`; }
  return `<svg class="rbadge" viewBox="0 0 24 24" width="${size}" height="${size}" title="${n}">${p}</svg>`; }
function myRank(){ return S.rank==null?200:S.rank; }
// Arena rank (fit to Monster Kingdom results): K 15, 1700-point spread
const RANK_K=15, RANK_SPREAD=1700;
function rankChange(me,op,win){ const e=1/(1+Math.pow(10,(op-me)/RANK_SPREAD)); return RANK_K*((win?1:0)-e); }
function isArena(mode){ return mode==='pvp'||mode==='rival'||mode==='local'||mode==='practice'||mode==='challenge'; }

// ---- start arena battles ----
function startBattle({mode, foe, meta, myName, oppRank}){
  const single=isArena(mode);
  const b=newBattle({name:myName||S.name, mons:mySnap()}, foe, {mode, single});
  B={b, mode, meta:meta||{}, mySide:0, ctl:['human', mode==='local'?'human':'ai'], tgt:{}, oppRank:oppRank==null?myRank():oppRank, oppAvatar: mode==='rival'?{t:'trainer',i:Math.floor(Math.random()*12)}:null, stamp:Date.now()};
  openBattle(); NET.updatePresence();
  if(single){ B.paused=true; renderBattle(); showIntro(()=>{ if(!B) return; B.paused=false; B.stamp=Date.now(); B.tkey=turnKey(B.b); drive(); }); }
  else drive();
}
function rivalTeam(){
  const tm=teamMons(); const avg=Math.round(tm.reduce((t,m)=>t+m.lvl,0)/Math.max(1,tm.length));
  const names=['Nour','Sami','Maya','Karim','Lina','Rami','Dana'];
  return {name:names[Math.floor(Math.random()*names.length)], mons:[0,1,2].map(()=>({sp:(P=>P[Math.floor(Math.random()*P.length)])(EGGSP()).id, lvl:Math.max(1,avg+Math.floor(Math.random()*3)-1)}))};
}

    <div class="iv-band mid">
      <div class="iv-side l">${pr(L)}<div class="iv-nm"><b>${esc(b.sides[L].name)}</b><span>${rankBadge(myR)}${B.mode==='local'?'':myR}</span></div></div>
      <div class="iv-vs">VS</div>
      <div class="iv-side r"><div class="iv-nm"><b>${esc(b.sides[R].name)}</b><span>${rankBadge(opR)}${B.mode==='local'?'':opR}</span></div>${pr(R)}</div>
    </div>`;

// ---- drive (phase-aware) ----
function drive(){
  if(!B) return; const b=B.b;
  clearTimeout(B.timer);
  renderBattle();
  if(!b||B.paused) return;
  if(b.over){ if(!B.finished){ B.finished=true; B.timer=setTimeout(finishBattle, 1400); } return; }
  if(b.single && b.phase==='pick'){
    const c=B.ctl[b.pickSide];
    if(c==='ai') B.timer=setTimeout(()=>{ if(!B||B.b!==b) return; pick(b,b.pickSide,aiPick(b,b.pickSide)); afterAct(); },500);
    return;
  }
  const a=actor(b); const c=B.ctl[a.s];
  if(c==='ai' || (c==='human' && B.auto && !(B.net&&B.net.role==='guest'&&B.net.sent===b.seq))){
    B.timer=setTimeout(()=>{ if(!B||B.b!==b||B.paused) return;
      if(B.net && B.net.role==='guest'){ NET.sendAction(aiChoose(JSON.parse(JSON.stringify(b)))); renderBattle(); return; }
      act(b, aiChoose(b)); afterAct(); }, c==='ai'?800:600);
  }
}

  const a=actor(b); return a && B.ctl[a.s]==='human' && !B.auto;
}

function playMusic(name){
  if(!SND.ctx){ SND.want=name; return; }

function schedule(){
  const c=SND.ctx; const T=TRACKS[SND.track]; if(!T) return;

// ---- sound effects ----
function sfx(kind,delay,opt){
  if(!SND.ctx||!SND.sfxOn) return; const t=SND.ctx.currentTime+(delay||0)/1000; opt=opt||{};
  switch(kind){
    case 'tap': tone(880,t,.05,'triangle',.25); break;
    case 'coin': tone(988,t,.07,'square',.25); tone(1319,t+.07,.18,'square',.25); break;
    case 'hit': noise(t,.14,.7,opt.crit?900:1400,null,.6); tone(opt.crit?140:200,t,.16,'square',.35,null,60); if(opt.crit) noise(t+.05,.2,.5,500); break;
    case 'zap': tone(1200,t,.18,'sawtooth',.25,null,300); noise(t,.12,.3,5000); break;
    case 'fire': noise(t,.3,.45,700,null,.5); tone(300,t,.25,'sawtooth',.18,null,120); break;
    case 'water': tone(500,t,.12,'sine',.4,null,900); tone(700,t+.08,.12,'sine',.35,null,1200); break;
    case 'whoosh': noise(t,.22,.35,1200,null,.4); break;
    case 'heal': [72,76,79,84].forEach((n,k)=>tone(mtof(n),t+k*.06,.22,'triangle',.3)); break;
    case 'buff': [67,71,74].forEach((n,k)=>tone(mtof(n+12),t+k*.05,.18,'sine',.3)); noise(t,.3,.12,6000); break;
    case 'miss': noise(t,.18,.25,3000,null,.4); break;
    case 'stun': [0,1,2].forEach(k=>tone(1400-k*200,t+k*.07,.08,'square',.2)); break;
    case 'faint': tone(400,t,.6,'triangle',.4,null,80); break;
    case 'go': tone(mtof(67),t,.1,'square',.3); tone(mtof(72),t+.1,.25,'square',.3); break;
    case 'vs': noise(t,.5,.4,600,null,.5); tone(mtof(43),t,.6,'sawtooth',.3); tone(mtof(55),t+.12,.5,'square',.25); break;
    case 'win': [72,76,79,84,79,84].forEach((n,k)=>tone(mtof(n),t+k*.12,k===5?.6:.14,'square',.3)); break;
    case 'lose': [67,64,60,55].forEach((n,k)=>tone(mtof(n),t+k*.18,.3,'triangle',.35)); break;
    case 'level': [60,64,67,72,76,79,84].forEach((n,k)=>tone(mtof(n),t+k*.07,.2,'square',.25)); break;

(function(){

  const canY=el=>{ const c=getComputedStyle(el); return /(auto|scroll)/.test(c.overflowY) && el.scrollHeight>el.clientHeight+1; };
  const canX=el=>{ const c=getComputedStyle(el); return /(auto|scroll)/.test(c.overflowX) && el.scrollWidth>el.clientWidth+1; };
  const find=(t,dir)=>{ for(let el=t; el && el!==document.body; el=el.parentElement){ if(el.matches&&el.matches('.ab,.hi,[data-noscroll]')) return null; if(dir==='y'?canY(el):canX(el)) return el; } return null; };

    cancelAnimationFrame(raf); const t=e.touches[0];
    st={x:t.clientX,y:t.clientY,lx:t.clientX,ly:t.clientY,t:performance.now(),v:0,el:null,ax:null,target:e.target}; moved=false;

    e.preventDefault();

})();

// ---- simple alert popup ----
function alertBox(msg){
  const w=document.createElement('div'); w.className='abox-wrap';
  w.innerHTML=`<div class="abox"><p>${esc(msg)}</p><button class="abox-ok">OK</button></div>`;
  document.body.appendChild(w); requestAnimationFrame(()=>w.classList.add('on'));
  const close=()=>{ w.classList.remove('on'); setTimeout(()=>w.remove(),200); };
  w.querySelector('.abox-ok').onclick=close; w.onclick=e=>{ if(e.target===w) close(); };
}

function rkStar(cx,cy,R,light,dark,id){ const r=R*0.46; let pts=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rr=i%2?r:R; pts.push([cx+Math.cos(a)*rr, cy+Math.sin(a)*rr]); }
  let g=''; for(let i=0;i<10;i++){ const p=pts[i], q=pts[(i+1)%10]; const lit=(i%2===0)?(i<5?light:shade(dark,25)):(i<5?shade(light,-12):dark);
    g+=`<path d="M${cx} ${cy} L${p[0].toFixed(2)} ${p[1].toFixed(2)} L${q[0].toFixed(2)} ${q[1].toFixed(2)}Z" fill="${lit}" stroke="${lit}" stroke-width=".25"/>`; }
  return {g, outline:'M'+pts.map(p=>p[0].toFixed(2)+' '+p[1].toFixed(2)).join(' L')+'Z'}; }
rankBadge=function(r,size){ const [,n,,k]=rankOf(r); size=size||26; const metal=n.split(' ')[0]; const [top,side]=RK_COL[metal]||['#ccc','#888'];
  let body='';
  if(k==='stripe'){
    const sideC=metal==='Emerald'?side:shade(top,-38), topD=shade(top,-14);
    const chev=(y)=>`<path d="M2.5 ${y+7.5} L12 ${y+2} L21.5 ${y+7.5} L21.5 ${y+10.5} L12 ${y+5} L2.5 ${y+10.5}Z" transform="translate(0 2.2)" fill="${sideC}"/>
      <path d="M2.5 ${y+7.5} L12 ${y+2} L12 ${y+5} L2.5 ${y+10.5}Z" fill="${top}"/><path d="M12 ${y+2} L21.5 ${y+7.5} L21.5 ${y+10.5} L12 ${y+5}Z" fill="${topD}"/>`;
    body=chev(0.5)+chev(7.5);
  } else if(n==='Emerald Star'){
    const s=rkStar(12,12.7,8.2,'#b23ad0','#5c1474');
    body=`<circle cx="12" cy="12" r="10.6" fill="#7a1a96"/><circle cx="12" cy="12" r="10.6" fill="none" stroke="${top}" stroke-width="1.9"/><path d="${s.outline}" fill="none" stroke="#6fe82a" stroke-width="2.4" stroke-linejoin="round"/>${s.g}`;
  } else { const s=rkStar(12,12.8,11,shade(top,18),side); body=s.g; }
  return `<svg class="rbadge" viewBox="0 0 24 24" width="${size}" height="${size}"><title>${n}</title>${body}</svg>`; };

// stat +/- buttons: one point when the finger lifts, hold to keep adding; no iOS magnifier
(function(){ let tmr=null, rep=null, sel=null, repeated=false;
  const fire=()=>{ const x=sel&&document.querySelector(sel); if(!x||x.disabled){ clearInterval(rep); rep=null; return; } x.click(); const y=document.querySelector(sel); if(y) y.classList.add('held'); };
  const clear=()=>{ clearTimeout(tmr); clearInterval(rep); tmr=rep=null; document.querySelectorAll('.pbtn.held').forEach(x=>x.classList.remove('held')); };
  const end=e=>{ if(!sel) return; const tap=!repeated && e.type==='touchend'; clear(); if(tap) fire(); document.querySelectorAll('.pbtn.held').forEach(x=>x.classList.remove('held')); sel=null; };
  addEventListener('touchstart',e=>{ const b=e.target.closest&&e.target.closest('[data-pp],[data-pm]'); if(!b) return;
    e.preventDefault(); clear(); if(b.disabled){ sel=null; return; }
    sel=b.dataset.pp?`[data-pp="${b.dataset.pp}"]`:`[data-pm="${b.dataset.pm}"]`; repeated=false; b.classList.add('held');
    b.addEventListener('touchend',end,{once:true}); b.addEventListener('touchcancel',end,{once:true});
    tmr=setTimeout(()=>{ repeated=true; fire(); rep=setInterval(fire,170); },650); },{capture:true,passive:false});
  addEventListener('touchend',end,{capture:true}); addEventListener('touchcancel',end,{capture:true});
  let lastTouch=0; addEventListener('touchstart',()=>{ lastTouch=Date.now(); },{capture:true,passive:true});
  addEventListener('click',e=>{ if(e.isTrusted && Date.now()-lastTouch<1000 && e.target.closest&&e.target.closest('[data-pp],[data-pm]')){ e.preventDefault(); e.stopImmediatePropagation(); } },true);

function agoTxt(t){ if(!t) return 'never'; const s=(Date.now()-t)/1000; return s<90?'just now':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'; }
function openPlayers(){
  const PER=4; let all=[], pg=0, me='', q='';
  const sh=sheet(`<div class="adm"><div class="adm-top"><h2>Players</h2><input id="aq" placeholder="Search name or code" autocomplete="off"><span class="adm-n" id="an"></span></div><div class="adm-list" id="al"><p class="adm-msg">Loading…</p></div><div class="adm-pg"><button class="btn ghost sm" id="ap">‹</button><span id="api"></span><button class="btn ghost sm" id="anx">›</button></div></div>`);
  const $a=s=>sh.body.querySelector(s);
  const load=async()=>{ $a('#al').innerHTML='<p class="adm-msg">Loading…</p>'; let r; try{ r=await withTimeout(MR_ACCT.adm('list',{q}),15000); }catch(_){ r=null; }
    if(!r||!r.ok){ $a('#al').innerHTML=`<p class="adm-msg">${r&&r.err==='admin'?'Admins only.':"Couldn't reach the server."}</p>`; return; }
    all=r.players; me=r.me; pg=0; draw(); };
  const draw=()=>{ const n=Math.max(1,Math.ceil(all.length/PER)); pg=Math.min(pg,n-1);
    $a('#an').textContent=all.length+(all.length===1?' player':' players'); $a('#api').textContent=(pg+1)+' / '+n;
    $a('#ap').disabled=pg===0; $a('#anx').disabled=pg>=n-1;
    const rows=all.slice(pg*PER,pg*PER+PER);
    $a('#al').innerHTML=rows.length?rows.map(p=>`<div class="adm-row${p.banned?' ban':''}" data-u="${esc(p.uid)}">
      <div class="adm-who"><b>${esc(p.name||'(no name)')}${p.uid===me?' · you':''}${p.banned?' <i>Banned</i>':''}</b><span>Lv ${p.lv} · ${p.mons} monster${p.mons===1?'':'s'} · ${agoTxt(p.seen)}</span><code data-copy="${esc(p.uid)}">${esc(p.uid)}</code></div>
      ${p.uid===me?`<div class="adm-act"><button class="btn sm ghost" data-gift>Gift 🍄</button></div>`:`<div class="adm-act"><button class="btn sm ghost" data-gift>Gift 🍄</button><button class="btn sm ghost" data-op="${p.banned?'unban':'ban'}">${p.banned?'Unban':'Ban'}</button><button class="btn sm ghost" data-op="rename">Rename</button><button class="btn sm red" data-op="delete">Delete</button></div>`}</div>`).join(''):'<p class="adm-msg">No players found.</p>';
    sh.body.querySelectorAll('[data-copy]').forEach(c=>c.onclick=()=>{ (navigator.clipboard?navigator.clipboard.writeText(c.dataset.copy):Promise.reject()).then(()=>toast('Code copied'),()=>{}); });
    sh.body.querySelectorAll('[data-gift]').forEach(b=>b.onclick=()=>{ const t=b.closest('.adm-row').dataset.u, p=all.find(x=>x.uid===t);
      const g=sheet(`<div class="gift"><h2>Gift mushrooms</h2><p>To <b>${esc(p.name||t)}</b>. They get them the next time their game saves.</p><div class="gift-row">${[50,100,500,1000,5000].map(n=>`<button class="btn sm" data-n="${n}">${n} 🍄</button>`).join('')}</div></div>`);
      g.body.querySelectorAll('[data-n]').forEach(x=>x.onclick=async()=>{ x.disabled=true; let r; try{ r=await withTimeout(MR_ACCT.adm('gift',{t,n:+x.dataset.n}),15000); }catch(_){ r=null; }
        if(!r||!r.ok){ x.disabled=false; return toast(r&&r.err==='unknown op'?'Update the server first':"Couldn't reach the server"); }
        g.close(); toast(`Sent ${x.dataset.n} 🍄 to ${p.name||'player'}`); if(t===me) setTimeout(()=>persist(),300); }); });
    sh.body.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{ const row=b.closest('.adm-row'), t=row.dataset.u, p=all.find(x=>x.uid===t), nm=esc(p.name||t), op=b.dataset.op;
      const go=async()=>{ b.disabled=true; let r; try{ r=await withTimeout(MR_ACCT.adm(op,{t}),15000); }catch(_){ r=null; }
        if(!r||!r.ok){ b.disabled=false; return toast(r&&r.err==='self'?"You can't do that to yourself":"Couldn't reach the server"); }
        if(op==='delete'){ all=all.filter(x=>x.uid!==t); toast('Deleted '+(p.name||'account')); }
        else if(op==='ban'||op==='unban'){ p.banned=op==='ban'; toast((op==='ban'?'Banned ':'Unbanned ')+(p.name||'account')); }
        else if(op==='rename'){ toast((p.name||'Player')+' will pick a new name'); p.name=null; }
        draw(); };
      const msg={ban:`Ban <b>${nm}</b>? They won't be able to save, battle or chat. You can unban later.`,
        unban:`Unban <b>${nm}</b>?`, rename:`Clear the name <b>${nm}</b>? They'll be asked to pick a new one.`,
        delete:`Delete <b>${nm}</b> forever? Their monsters and progress are erased and the name is freed. This can't be undone.`}[op];
      confirmBox(msg, {ban:'Ban',unban:'Unban',rename:'Clear name',delete:'Delete'}[op], go); }); };
  $a('#ap').onclick=()=>{ pg--; draw(); }; $a('#anx').onclick=()=>{ pg++; draw(); };
  let tq; $a('#aq').addEventListener('input',()=>{ clearTimeout(tq); tq=setTimeout(()=>{ q=$a('#aq').value.trim(); load(); },500); });
  load(); }

eye3=(function(base){

      if(/(auto|scroll)/.test(cs.overflowY+cs.overflowX)&&(n.scrollHeight>n.clientHeight+1||n.scrollWidth>n.clientWidth+1)) return true; } return false; };

    const st=60/T.bpm/2; const L=Math.min(256,[T.lead.length,T.bass.length,32].reduce(lcm,1)); const dur=L*st, tail=2.0, sr=22050;
    const off=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,Math.ceil((dur+tail)*sr),sr);

      createBufferSource:()=>off.createBufferSource(), createBiquadFilter:()=>off.createBiquadFilter(), destination:off.destination };
    const keep={ctx:SND.ctx,mus:SND.mus,track:SND.track,step:SND.step,next:SND.next};
    try{ SND.ctx=fake; SND.mus=off.destination; SND.track=name; SND.step=0; SND.next=0; liveSchedule(); }
    finally{ Object.assign(SND,keep); }
    const full=await off.startRendering(); const n=Math.round(dur*sr), out=SND.ctx.createBuffer(1,n,sr), a=full.getChannelData(0), o=out.getChannelData(0);

    if(srcName===name&&src) return; pending=name;
    const buf=await render(name); if(!buf||pending!==name||SND.track!==name) return;

})();

// ---------- Smarter AI for arena-style fights: looks ahead at each option and your likely reply ----------
(function(){
  const baseAI=aiChoose;

  function settle(c){ let g=0; while(!c.over&&c.phase==='pick'&&g++<4){ const s=c.pickSide; const i=aiPick(c,s); if(i==null||!pick(c,s,i)) break; } }
  function evalFor(c,s){ if(c.over) return c.winner===s?1e5:-1e5; let v=0;
    c.sides.forEach((sd,k)=>{ const sign=k===s?1:-1; sd.mons.forEach(m=>{ if(m.hp<=0) return; let x=60+100*m.hp/m.maxhp+12*m.mp/Math.max(1,m.maxmp);
      ['burn','poison','storm','frost'].forEach(d=>{ if(m.st[d]>0) x-=Math.min(60,(m.st[d+'D']||0)*m.st[d]/m.maxhp*100*0.7); });
      ['bubble','lsh','fsh','nsh','mshield','pers','fwall'].forEach(z=>{ if(m.st[z]>0) x+=4; }); if(m.st.stun>0) x-=15; v+=sign*x; }); }); return v; }
  function options(b){ const a=actor(b); const m=a.m; const opts=[];
    ['basic',...usable(m)].forEach(id=>{ let ts=[]; try{ ts=validTargets(b,a.s,id)||[]; }catch(_){ ts=[]; } if(!ts.length) ts=[null]; ts.forEach(t=>opts.push({skill:id,target:t})); });
    return opts; }
  function score(b,s,o){ let tot=0; const N=2;
    for(let k=0;k<N;k++){ const c=clone(b); c.rng=((b.rng|0)+7919*(k+1))|0; c.ev=[]; c.log=[];

      // your most likely reply
      let g=0; while(!c.over&&g++<2){ const a2=actor(c); if(!a2||a2.s===s) break; const r=baseAI(c); if(!r||!act(c,r)) break; settle(c); }

// battle info card in the Monster Kingdom layout: picture left, name + stats right, then effects, abilities, items below (whole card scrolls)
monInfo=(function(prev){ return function(b,s,i){ const r=prev(b,s,i); try{ const box=[...document.querySelectorAll('.minfo2')].pop(); if(!box||box._mk) return r; box._mk=1;
  const m=b.sides[s].mons[i]; const L=box.querySelector('.mi2-l'), R=box.querySelector('.mi2-r'); if(!L||!R) return r;
  const top=document.createElement('div'); top.className='mi3-top'; const info=document.createElement('div'); info.className='mi3-info';
  const art=L.querySelector('.mi-art'), nm=L.querySelector('.mi-nm'); top.appendChild(art); top.appendChild(info);
  if(nm){ info.appendChild(nm); nm.insertAdjacentHTML('afterend',`<span class="mi3-stage">${STAGE_N[stageOf(m.lvl)].toLowerCase()}</span>`); }
  L.querySelectorAll('.lb').forEach(x=>info.appendChild(x));
  info.insertAdjacentHTML('beforeend',`<div class="mi3-stats"><div><span>Attack</span><b>${m.atk}</b></div><div><span>Life</span><b>${m.maxhp}</b></div><div><span>Mana</span><b>${m.maxmp}</b></div></div>`);
