<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Monster Realm</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Monster Realm">
<meta name="theme-color" content="#1d1d22">
<script>window.MR_BACKEND='https://script.google.com/macros/s/AKfycby5DE_LY38JXkaPxdOrTCVbP0X-6nRm2i48vg6oQIvuUlU4CqajFBsDSMSWyyxJODnb/exec';</script>
<script src="adapter.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
:root{--sa-top:env(safe-area-inset-top);--sa-bottom:env(safe-area-inset-bottom);--sa-left:env(safe-area-inset-left);--sa-right:env(safe-area-inset-right)}
:root{--vw:1vw;--vh:1vh}
body.rot{position:fixed;top:var(--sa-top);left:0;width:calc(100vh - var(--sa-top) - var(--sa-bottom));height:100vw;transform-origin:top left;transform:rotate(90deg) translateY(-100%);overflow:hidden}

:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mu:#8e8e93;--ln:rgba(60,60,67,.12);--ac:#007aff;--ok:#34c759;--bad:#ff3b30;--fill:rgba(118,118,128,.12)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#98989f;--ln:rgba(84,84,88,.5);--ac:#0a84ff;--fill:rgba(118,118,128,.24)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:disabled{opacity:.4;cursor:default}
svg{display:block}
h1{font-size:30px;font-weight:700;letter-spacing:-.4px;margin:8px 0 14px}
h2{font-size:22px;margin:4px 0 4px;letter-spacing:-.3px}
h3{font-size:17px;margin:0}
.muted{color:var(--mu)}.small{font-size:13px}.center{text-align:center}
#app{max-width:560px;margin:0 auto;min-height:calc(100*var(--vh));padding:calc(var(--sa-top) + 64px) 16px calc(var(--sa-bottom) + 90px)}
#top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sa-top) + 10px) max(16px,calc(calc(50*var(--vw)) - 264px)) 10px;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--ln)}
.who{display:flex;flex-direction:column}.who b{font-size:16px}.who span{font-size:12px;color:var(--mu)}
.pills{display:flex;gap:6px}.pill{background:var(--card);border-radius:20px;padding:6px 11px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:baseline;box-shadow:0 1px 2px rgba(0,0,0,.05)}.pill small{font-weight:500;color:var(--mu);font-size:11px}
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;justify-content:center;padding:6px 0 calc(var(--sa-bottom) + 6px);background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--ln)}
#tabs button{flex:0 1 120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--mu);position:relative;padding:4px 0}
#tabs button svg{width:26px;height:26px}#tabs button.on{color:var(--ac)}
#qbadge{position:absolute;top:0;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px}
body.inbattle #tabs,body.inbattle #top{display:none}
.btn{display:block;width:100%;background:var(--ac);color:#fff;font-weight:600;font-size:16px;border-radius:14px;padding:14px;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.97)}.btn.sm{width:auto;font-size:14px;padding:8px 14px;border-radius:18px}.btn.ghost{background:var(--fill);color:var(--ac)}.btn.danger{background:var(--bad)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);vertical-align:1px;margin-left:4px}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.bar i{display:block;height:100%;border-radius:3px;transition:width .45s ease}
.bar.hp i{background:var(--ok)}.bar.mp i{background:#5e8bff}.bar.xp i{background:#ff9f0a}
.zones{display:flex;flex-direction:column;gap:10px}
.zone{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px 14px 10px 10px;text-align:left;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.zone-art{width:64px;height:64px;border-radius:14px;background:color-mix(in srgb,var(--zc) 22%,transparent);flex:none}
.zone.locked .zone-art{filter:grayscale(1) brightness(.4);opacity:.6}
.zone-info{flex:1;display:flex;flex-direction:column;gap:2px}.zone-info b{font-size:17px}.zone-info span{font-size:13px;color:var(--mu)}
.dots{display:flex;gap:5px;margin-top:4px}.dots i{width:8px;height:8px;border-radius:4px;background:var(--fill)}.dots i.on{background:var(--zc)}.dots i.boss{width:14px}
.zone-go{color:var(--mu);font-size:22px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mcard{background:var(--card);border-radius:16px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;position:relative;min-height:128px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.mcard svg{width:76px;height:76px}.mcard b{font-size:14px}.mcard span{font-size:11.5px;color:var(--mu)}
.mcard.empty{justify-content:center;border:1.5px dashed var(--ln);background:transparent;box-shadow:none}
.mcard.sel{outline:2.5px solid var(--ac)}
.eldot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:4px}
.tslot{position:absolute;top:6px;left:8px;font-style:normal;font-size:11px;font-weight:700;color:var(--mu)}
.hatch{display:flex;align-items:center;gap:12px;width:100%;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:10px;text-align:left}
.hatch>div:nth-child(2){flex:1;display:flex;flex-direction:column}.hatch span{font-size:13px;color:var(--mu)}
.egg{width:34px;height:42px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;background:linear-gradient(160deg,#fff3c4,#ffc857);box-shadow:inset -4px -4px 0 rgba(0,0,0,.08)}
.list{display:flex;flex-direction:column;background:var(--card);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--ln)}.row:last-child{border:0}
.row>div:first-child{flex:1;display:flex;flex-direction:column}.row span{font-size:13px;color:var(--mu)}.row.done b{color:var(--mu)}
.grow{flex:1;display:flex;flex-direction:column;gap:5px}
.ok{color:var(--ok);font-weight:700}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px}.card.tap{cursor:pointer}.card.tap:active{opacity:.7}
.card .list{background:transparent;margin:6px -14px -14px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.live{font-size:13px;color:var(--mu);font-weight:600}.live.on{color:var(--ok)}
/* sheets: slide from the right, drag right to dismiss */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .28s}
.sheet{position:absolute;top:0;right:0;bottom:0;width:min(100%,440px);background:var(--bg);transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:calc(var(--sa-top) + 18px) 18px calc(var(--sa-bottom) + 24px);touch-action:pan-y;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.sheet.dragging{transition:none}
.sheet-wrap.open{pointer-events:auto}.sheet-wrap.open .sheet-bg{opacity:1}.sheet-wrap.open .sheet{transform:translateX(0)}
.sheet-x{position:sticky;top:0;float:right;width:30px;height:30px;border-radius:15px;background:var(--fill);color:var(--mu);font-size:13px;z-index:2}
.sheet-body{clear:none}
.stages{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.stage{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 12px}
.stage.locked{opacity:.45}
.stage-mons{display:flex;margin-right:2px}.stage-mons svg{width:40px;height:40px;margin-right:-8px}
.stage-mons.big{justify-content:center;margin:12px 0}.stage-mons.big svg{width:90px;height:90px;margin:0}
.stage-info{flex:1;display:flex;flex-direction:column;padding-left:8px}.stage-info span{font-size:12.5px;color:var(--mu)}
.mon-hero{width:170px;height:170px;margin:8px auto 6px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent) 0,transparent 70%)}
.mon-hero svg{width:100%;height:100%}.mon-hero.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.sheet h2,.sheet>.sheet-body>p.muted{text-align:center}
.lvrow{display:flex;align-items:center;gap:10px;margin:14px 0 4px}.lvrow .bar{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 18px}
.stats div{background:var(--card);border-radius:12px;padding:8px;text-align:center;display:flex;flex-direction:column}.stats span{font-size:11px;color:var(--mu)}.stats b{font-size:17px}
.skills{display:flex;flex-direction:column;gap:6px;margin:8px 0 18px}
.skill{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px}
.skill>i{width:10px;height:10px;border-radius:5px;flex:none}.skill>div{flex:1;display:flex;flex-direction:column}.skill span{font-size:12.5px;color:var(--mu)}.skill em{font-style:normal;font-size:12px;color:#5e8bff;font-weight:600}
.skill.locked{opacity:.5}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:8px}.swap{display:flex;flex-wrap:wrap;gap:6px}
.reveal,.result{text-align:center}.result .list{margin:14px 0;text-align:left}.row>div.rmon{flex:none}.rmon svg{width:44px;height:44px}
.tag{font-size:12px;font-weight:700;color:#ff9f0a;background:rgba(255,159,10,.14);padding:3px 8px;border-radius:9px}.tag.evo{color:#af52de;background:rgba(175,82,222,.14)}
.onb{text-align:center}.onb p{margin:8px 0}
.lila{width:64px;height:64px;border-radius:32px;margin:10px auto 0;background:linear-gradient(135deg,#ff9fb0,#b07cd8);color:#fff;font-weight:700;font-size:28px;line-height:64px}
.onb input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:0;background:var(--card);color:var(--tx);margin:6px 0 10px;outline:none;text-align:center}
.fams{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px}
.fam{background:var(--card);border-radius:16px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.fam svg{width:80px;height:80px}.fam b{font-size:13px}.fam.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card))}
#toast{position:fixed;left:50%;bottom:calc(var(--sa-bottom) + 90px);transform:translate(-50%,20px);background:rgba(28,28,30,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;z-index:100;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* battle */
#battle{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,color-mix(in srgb,#e3262d 10%,var(--bg)),var(--bg) 40%,var(--bg) 60%,color-mix(in srgb,#22a6e3 10%,var(--bg)));display:none;flex-direction:column;padding:calc(var(--sa-top) + 8px) 10px calc(var(--sa-bottom) + 10px)}
#battle.open{display:flex}
.btop{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mu);font-weight:500}
.btop .foe-n{margin-left:auto;font-weight:600;color:var(--tx)}
.iconb{width:32px;height:32px;border-radius:16px;background:rgba(0,0,0,.35);color:#fff}
.brow{display:flex;justify-content:center;gap:8px;margin:8px auto;width:100%;max-width:560px}
.bmon{width:calc((100% - 16px)/3);flex:none;background:var(--card);border-radius:16px;padding:6px 8px 8px;position:relative;transition:transform .2s,box-shadow .2s;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.bart{height:min(calc(22*var(--vw)),104px)}.bart svg{width:100%;height:100%}
.bname{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin:2px 0 4px}.bname span{font-size:11px;color:var(--mu)}
.bmon .bar{height:5px;margin-top:3px}.bnum{font-size:10.5px;color:var(--mu);margin-top:2px;font-variant-numeric:tabular-nums}
.sts{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;min-height:15px}.st{font-style:normal;font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:6px;background:var(--fill)}
.st.burn{color:#e3262d}.st.poison{color:#1fa03a}.st.stun{color:#f7b500}.st.bubble{color:#22a6e3}.st.ms{color:#5e8bff}.st.up{color:#ff9f0a}.st.guard{color:#a2845e}.st.spark{color:#f7b500}
.bmon.acting{box-shadow:0 0 0 2.5px var(--ac),0 6px 18px rgba(0,122,255,.2);transform:translateY(-3px)}
.bmon.target{box-shadow:0 0 0 2.5px #ff9f0a;cursor:pointer;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,159,10,.5)}}
.bmon.ko{opacity:.35;filter:grayscale(1)}
.bmon.shake .bart{animation:shake .4s}.bmon.bump .bart{animation:bump .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes bump{50%{transform:scale(1.12)}}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-weight:800;font-size:20px;color:var(--bad);text-shadow:0 1px 0 #fff,0 0 6px rgba(255,255,255,.8);animation:fl 1.1s ease-out both;pointer-events:none;white-space:nowrap}
.float.heal{color:var(--ok)}.float.buff,.float.stun{color:var(--ac);font-size:14px}.float.crit{font-size:26px}
@keyframes fl{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-34px)}}
.eff{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:10px;font-weight:800;color:#ff9f0a;animation:fl 1.2s both}
.blog{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13.5px;color:var(--mu);min-height:40px;padding:0 10px}
.bctl{background:var(--card);border-radius:20px;padding:12px;max-width:560px;width:100%;margin:0 auto;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px;box-shadow:0 -2px 12px rgba(0,0,0,.05)}
.bturn{font-size:14px;color:var(--mu)}.bturn b{color:var(--tx)}
.bmsg{text-align:center;font-size:15px}
.bctl .btn.ghost.sm{align-self:center}
.skgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.skb{background:color-mix(in srgb,var(--c) 13%,var(--card));border-radius:12px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;border-left:4px solid var(--c)}
.skb b{font-size:14px}.skb span{font-size:11.5px;color:var(--mu)}.skb:active{transform:scale(.97)}
.bwait{margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.spinner{width:30px;height:30px;border:3px solid var(--fill);border-top-color:var(--ac);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

/* splash */
#splash{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;
 background:radial-gradient(ellipse at 50% 45%,#3a3a40 0,#1d1d22 60%,#0c0c0f 100%);transition:opacity .5s,transform .5s}
#splash::before{content:"";position:absolute;inset:0;opacity:.35;background:
 repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 9px),repeating-linear-gradient(25deg,rgba(0,0,0,.25) 0 1px,transparent 1px 13px)}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.spark{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:#ffd76a;box-shadow:0 0 10px 3px rgba(255,200,80,.7);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-105vh);opacity:0}}
.sp-plate{position:relative;max-width:calc(88*var(--vw));padding:22px 26px 18px;border-radius:26px;background:linear-gradient(180deg,#2c2f3a,#1b1d25);box-shadow:0 0 0 4px #5b6cff,0 0 0 8px #1b1d25,0 0 0 10px #8fa0ff,0 20px 60px rgba(0,0,0,.6);animation:drop .8s cubic-bezier(.2,1.5,.4,1) both}
@keyframes drop{0%{transform:translateY(-60px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.sp-title{font-family:"Lilita One",system-ui,sans-serif;text-align:center;line-height:.92;letter-spacing:1px;text-transform:uppercase}
.sp-title span{display:block;font-size:min(calc(13*var(--vw)),72px);background:linear-gradient(180deg,#ffffff 0,#bfe7ff 45%,#4fb3ff 55%,#2a6fe0 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #10183d;filter:drop-shadow(0 5px 0 #10183d) drop-shadow(0 0 18px rgba(80,160,255,.55))}
.sp-title span+span{font-size:min(calc(15.5*var(--vw)),88px);background:linear-gradient(180deg,#fff 0,#ffd6f3 45%,#ff6fb5 55%,#c2328a 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 5px 0 #10183d) drop-shadow(0 0 18px rgba(255,110,180,.5))}
.sp-mon{position:absolute;width:min(calc(34*var(--vw)),170px);bottom:-12%;animation:peek 1s .5s cubic-bezier(.2,1.4,.4,1) both,bob 2.4s 1.5s ease-in-out infinite}
.sp-mon.l{left:-22%;--r:-12deg}.sp-mon.r{right:-22%;--r:12deg}
@keyframes peek{0%{transform:translateY(60%) rotate(var(--r));opacity:0}100%{transform:rotate(var(--r));opacity:1}}
@keyframes bob{50%{transform:translateY(-6px) rotate(var(--r))}}
.sp-load{margin-top:48px;width:min(calc(70*var(--vw)),280px);text-align:center;color:#c9c9d6;font:600 13px -apple-system,system-ui,sans-serif;position:relative}
.sp-bar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:10px;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.sp-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#ffb000,#ffe066);box-shadow:0 0 10px #ffc43d;transition:width .25s}
.sp-tap{font-family:"Lilita One",system-ui;font-size:22px;color:#ffe066;letter-spacing:1px;animation:blink 1.2s ease-in-out infinite;text-shadow:0 2px 0 #000}
@keyframes blink{50%{opacity:.35;transform:scale(.96)}}
/* lively monsters */
.mcard svg,.bart svg,.mon-hero svg,.zone-art svg{animation:idle 2.6s ease-in-out infinite;transform-origin:50% 90%}
.mcard:nth-child(2n) svg,.bmon:nth-child(2) .bart svg{animation-delay:-.9s}.mcard:nth-child(3n) svg,.bmon:nth-child(3) .bart svg{animation-delay:-1.7s}
@keyframes idle{50%{transform:translateY(-3px) scaleY(1.03) scaleX(.98)}}
.bmon.ko .bart svg{animation:faint .6s forwards}
@keyframes faint{to{transform:rotate(90deg) translate(10%,-10%) scale(.85);opacity:.6}}
.bmon .bart{position:relative}
.bmon.lunge-up .bart{animation:lungeU .42s cubic-bezier(.3,0,.3,1)}
.bmon.lunge-down .bart{animation:lungeD .42s cubic-bezier(.3,0,.3,1)}
@keyframes lungeU{35%{transform:translateY(-22px) scale(1.12)}}
@keyframes lungeD{35%{transform:translateY(22px) scale(1.12)}}
.bmon.cast .bart{animation:cast .5s}
@keyframes cast{40%{transform:scale(1.15);filter:brightness(1.4)}}
.bmon.hitflash .bart svg{animation:flash .45s}
@keyframes flash{0%,100%{filter:none}20%{filter:brightness(3) saturate(0)}50%{filter:brightness(1.6)}}
.bmon.shake{animation:cshake .4s}
@keyframes cshake{20%{transform:translateX(-7px) rotate(-2deg)}40%{transform:translateX(7px) rotate(2deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.proj{position:fixed;z-index:30;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff 0,var(--c) 45%,transparent 72%);box-shadow:0 0 18px 6px var(--c);transition:transform .32s cubic-bezier(.4,0,.6,1)}
.proj.bolt{border-radius:3px;width:10px;height:34px;margin:-17px 0 0 -5px;background:linear-gradient(#fff,var(--c))}
.burst{position:fixed;z-index:31;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;pointer-events:none;border:4px solid var(--c);box-shadow:0 0 24px var(--c),inset 0 0 18px var(--c);animation:burst .45s ease-out forwards}
@keyframes burst{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.3);opacity:0}}
.ring{position:absolute;inset:6px;border-radius:14px;pointer-events:none;border:3px solid var(--c);box-shadow:0 0 18px var(--c);animation:ring .7s ease-out forwards}
@keyframes ring{0%{transform:scale(.7);opacity:1}100%{transform:scale(1.08);opacity:0}}
.sparkle{position:absolute;bottom:30%;width:7px;height:7px;border-radius:50%;background:#7dff9b;box-shadow:0 0 8px #34c759;pointer-events:none;animation:up .9s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-50px)}}
.float{font-family:"Lilita One",system-ui;font-weight:400;-webkit-text-stroke:1.5px rgba(0,0,0,.55);text-shadow:0 2px 0 rgba(0,0,0,.35);font-size:24px}
.float.crit{font-size:32px}
#battle.quake{animation:cshake .35s}

/* ===== game shell ===== */
body{overflow:hidden;height:calc(100*var(--vh));height:calc(100*var(--vh))}
#view{position:fixed;inset:0}
.scene{position:absolute;inset:0;overflow:hidden;background:#5aa646}
.sky{position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,#4a9be0,#9fd3f7 70%,#d6eefc)}
.sun{position:absolute;left:14%;top:calc(var(--sa-top) + 120px);width:48px;height:48px;border-radius:50%;background:#fffdf0;box-shadow:0 0 40px 14px rgba(255,255,230,.7)}
.cloud{position:absolute;height:26px;border-radius:20px;background:#fff;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:34px;height:34px;left:14px;top:-16px}.cloud::after{width:26px;height:26px;left:40px;top:-10px}
.c1{width:90px;top:22%;animation-duration:70s;animation-delay:-20s}.c2{width:70px;top:30%;animation-duration:90s;animation-delay:-60s;transform:scale(.8)}.c3{width:110px;top:16%;animation-duration:110s;animation-delay:-5s}
@keyframes drift{from{transform:translate3d(calc(-130px - var(--cx,0px)),0,0)}to{transform:translate3d(calc(110vw - var(--cx,0px)),0,0)}}
.hills{position:absolute;left:0;right:0;top:36%;height:16%;width:100%}
.grass{position:absolute;left:0;right:0;top:51.5%;bottom:0;background:linear-gradient(180deg,#72b84e,#5aa646 40%,#4b9a3b);}
.grass::after{content:"";position:absolute;inset:0;opacity:.25;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(30,90,20,.35) 6px 7px)}
.shroom{position:absolute;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.pet{position:absolute;width:min(calc(30*var(--vw)),150px);transform:translate(-50%,-100%);z-index:2}
.pet svg{width:100%;height:auto;animation:idle 2.4s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 2px 0 rgba(0,0,0,.08))}
.pet:nth-of-type(2n) svg{animation-delay:-.8s}
.pet .shadow{position:absolute;left:22%;right:22%;bottom:4%;height:12%;border-radius:50%;background:rgba(0,0,0,.22)}
.lvb{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;border-radius:6px 6px 11px 11px;background:linear-gradient(#ff5fc8,#c22d99);color:#fff;font:15px "Lilita One",system-ui;box-shadow:0 0 0 2px #fff}
.pet .lvb{position:absolute;right:16%;top:12%}
.banner{position:absolute;left:50%;top:calc(var(--sa-top) + 128px);transform:translateX(-50%);font:22px "Lilita One",system-ui;color:#c8ff4a;padding:8px 22px;border-radius:12px;background:linear-gradient(#b0389a,#7b1f6b);box-shadow:0 0 0 3px #f2c94c,0 0 0 5px #5a1450,0 6px 14px rgba(0,0,0,.3);-webkit-text-stroke:1.2px #2b4a00;letter-spacing:.5px;z-index:3}
.banner:active{transform:translateX(-50%) scale(.95)}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;gap:8px;padding:calc(var(--sa-top) + 8px) 10px 8px;background:linear-gradient(180deg,rgba(10,30,60,.85),rgba(10,30,60,.55));max-width:none}
.avatar{width:62px;height:62px;flex:none;border-radius:10px;background:linear-gradient(#e8d9b5,#b99a63);box-shadow:0 0 0 3px #3a2a14,inset 0 0 0 2px rgba(255,255,255,.5);overflow:hidden}
.avatar svg{width:100%;height:100%}
.hcol{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}.hrow{display:flex;gap:6px}
.hbar{height:28px;border-radius:14px;background:#141820;box-shadow:inset 0 0 0 2px #7a1414,0 1px 0 rgba(255,255,255,.1);color:#fff;display:flex;align-items:center;gap:6px;padding:0 10px 0 4px;font-size:14px;font-weight:600;position:relative}
.hbar .ico{width:22px;height:22px;border-radius:11px;background:#222;box-shadow:0 0 0 2px #f2c94c;color:#f2c94c;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.hbar .ico.m{background:#2a1430;box-shadow:0 0 0 2px #c86ae0}.hbar .ico.m svg{width:17px}
.hbar.name{flex:1;min-width:0}.hbar.name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.hbar.name em{font-style:normal;color:#f2c94c;font-size:12px}
.hbar.shrooms{box-shadow:inset 0 0 0 2px #7a2a8a}.hbar.shrooms small{position:absolute;right:-2px;bottom:-11px;font-size:9.5px;background:#5a1450;padding:1px 6px;border-radius:7px;box-shadow:0 0 0 1px #c86ae0}
.ebar{flex:1;height:18px;border-radius:9px;background:#3a0a0a;position:relative;overflow:hidden}
.ebar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#d61f1f,#f05a14 50%,#f2d01e);border-radius:9px;transition:width .4s}
.ebar b{position:relative;display:block;text-align:center;font-size:12px;line-height:18px;text-shadow:0 1px 2px #000}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;padding:6px 6px calc(var(--sa-bottom) + 8px);background:linear-gradient(0deg,rgba(10,20,40,.7),transparent)}
.gb{flex:1;height:48px;border-radius:10px;font:min(calc(4*var(--vw)),19px) "Lilita One",system-ui;color:#fff;letter-spacing:.3px;position:relative;box-shadow:0 0 0 2px #fff,0 0 0 4px rgba(0,0,0,.35),0 4px 8px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.gb.red{background:linear-gradient(#ff6a5a,#d42a22 52%,#a8150f)}.gb.blue{background:linear-gradient(#6fa4ff,#2f62d8 52%,#1d43a8)}
.gb::after{content:"";position:absolute;left:6px;right:6px;top:4px;height:40%;border-radius:8px 8px 14px 14px;background:linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,0))}
.gb:active{transform:translateY(2px) scale(.97)}
.gb em{position:absolute;top:-8px;right:-4px;font:12px -apple-system,system-ui;font-weight:700;background:#ffd60a;color:#000;min-width:20px;height:20px;line-height:20px;border-radius:10px;padding:0 5px;box-shadow:0 0 0 2px #fff;text-shadow:none}
body.inbattle #hud,body.inbattle #bar{display:none}
/* panels */
.sheet.panel h1,.sheet.panel h2,.game-h{font-family:"Lilita One",system-ui;font-weight:400;letter-spacing:.3px}
.sheet.panel{background:linear-gradient(#fbf3dc,#f1e4bf);color:#2b2216;box-shadow:-6px 0 0 #8a5a2b,-12px 0 30px rgba(0,0,0,.3)}
.sheet.panel .muted{color:#7a6a50}.sheet.panel .card,.sheet.panel .zone,.sheet.panel .list,.sheet.panel .hatch,.sheet.panel .stage{background:#fffaf0;box-shadow:0 0 0 2px #e0cfa4}
.sheet.panel .row{border-color:#eadcb6}
.price{font:18px "Lilita One",system-ui;color:#8a2a90}.egg.bolt{background:linear-gradient(#ffe36b,#ff9f0a);display:flex;align-items:center;justify-content:center;font-size:18px}
.btn.gbtn,.sheet.panel .btn{background:linear-gradient(#ff6a5a,#d42a22 52%,#a8150f);font:19px "Lilita One",system-ui;letter-spacing:.3px;box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.25);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.sheet.panel .btn.ghost{background:linear-gradient(#6fa4ff,#2f62d8);color:#fff}
/* team screen */
.sheet.full{width:100%;padding:0;background:#2d3a1f}
.sheet.full .sheet-x{display:none}
.tscreen{display:flex;flex-direction:column;min-height:100%}
.plankbar{display:flex;align-items:center;gap:8px;padding:calc(var(--sa-top) + 8px) 10px 8px;background:linear-gradient(#21324a,#162236);border-bottom:4px solid #c9a067}
.plank{flex:1;text-align:center;font:min(calc(6.4*var(--vw)),28px) "Lilita One",system-ui;color:#f5ead0;padding:6px 10px;border-radius:6px;background:linear-gradient(#7a4a2a,#5a3219);box-shadow:inset 0 0 0 3px #c9a067,inset 0 0 0 5px #4a2a12;text-shadow:0 2px 0 #2a1608}
.done{font:20px "Lilita One",system-ui;color:#fff;padding:8px 14px;border-radius:8px;background:linear-gradient(#ff6a5a,#c4231c);box-shadow:0 0 0 2px #fff,0 3px 6px rgba(0,0,0,.4)}
.tfield{position:relative;height:calc(46*var(--vh));min-height:280px;overflow:hidden}
.tfield .scene{position:absolute;inset:0}.tfield .sun{top:30px}
.tslots{position:absolute;left:0;right:0;top:12%;display:flex;justify-content:center;gap:8px;padding:0 10px;z-index:3}
.tcard{width:min(calc(30*var(--vw)),140px);flex:none;border-radius:12px;background:linear-gradient(#2f6a78,#1d4a56);box-shadow:0 0 0 2px rgba(255,255,255,.85),0 6px 14px rgba(0,0,0,.35);position:relative;overflow:hidden;cursor:pointer;transition:transform .15s}
.tcard:active{transform:scale(.95)}
.tcard svg{width:100%;height:auto;animation:idle 2.4s ease-in-out infinite;transform-origin:50% 90%}
.tcard.empty{height:min(calc(38*var(--vw)),170px);background:rgba(255,255,255,.18);box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;color:#fff;font:16px "Lilita One",system-ui;cursor:default}
.tname{display:flex;align-items:center;gap:6px;background:#111;color:#fff;padding:4px 6px;font:min(calc(4*var(--vw)),17px) "Lilita One",system-ui}.tname b{font-weight:400;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tname i{width:9px;height:9px;border-radius:5px;flex:none}
.tname .lvb{min-width:20px;height:20px;font-size:13px;box-shadow:none}
.info{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:11px;background:#fff;color:#111;font:italic 700 14px Georgia,serif;z-index:2}
.bench{flex:1;background:linear-gradient(#3a5a26,#2a4419);padding:10px 0 calc(var(--sa-bottom) + 16px);box-shadow:inset 0 6px 12px rgba(0,0,0,.35)}
.bench-h{color:#d6e8c0;font-size:13px;text-align:center;margin:0 12px 10px}
.bench-row{display:flex;gap:10px;overflow-x:auto;padding:4px 12px 10px;scroll-snap-type:x mandatory}.bench-row .tcard{scroll-snap-align:start;width:min(calc(28*var(--vw)),130px)}
/* lila */
.lila-wrap{position:fixed;inset:0;z-index:150;display:flex;align-items:flex-end;justify-content:center;padding:0 10px calc(var(--sa-bottom) + 76px);background:rgba(0,0,0,.25);animation:fadein .25s}
.lila-wrap.out{opacity:0;transition:opacity .25s}
@keyframes fadein{from{opacity:0}}
.lila-box{width:100%;max-width:520px;display:flex;gap:10px;padding:10px;border-radius:16px;background:#f2eba8;box-shadow:0 0 0 3px #5a4a1a,0 10px 30px rgba(0,0,0,.4);animation:boxin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes boxin{from{transform:translateY(40px) scale(.9);opacity:0}}
.lila-por{width:118px;flex:none;position:relative}.lila-por svg{width:100%;height:auto;display:block}
.lila-name{position:absolute;left:4px;right:4px;bottom:0;background:#111;color:#fff;text-align:center;border-radius:8px;font:20px "Lilita One",system-ui;padding:2px 0}
.lila-txt{flex:1;display:flex;flex-direction:column;gap:8px}
.lila-txt p{margin:0;flex:1;background:#fff;border-radius:12px;padding:10px 12px;font-size:16.5px;line-height:1.35;color:#222;box-shadow:inset 0 0 0 1.5px #444}
.nextb{align-self:flex-end;font:18px "Lilita One",system-ui;color:#fff;padding:7px 20px;border-radius:7px;background:linear-gradient(#e2433a,#a8150f);box-shadow:0 0 0 2px #fff,0 2px 5px rgba(0,0,0,.3)}
.garrow{position:fixed;left:8%;bottom:calc(var(--sa-bottom) + 64px);width:44px;height:64px;z-index:151;background:linear-gradient(#b6ff5a,#3fbf1f);clip-path:polygon(30% 0,70% 0,70% 55%,100% 55%,50% 100%,0 55%,30% 55%);filter:drop-shadow(0 0 2px #0a4a00);animation:point .8s ease-in-out infinite}
@keyframes point{50%{transform:translateY(10px)}}
.lila-wrap.arrow-zones{padding-bottom:calc(var(--sa-bottom) + 140px)}
/* battle backdrop */
#battle{background:#5aa646}
.bsky{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#4a9be0 0,#9fd3f7 30%,color-mix(in srgb,var(--zc) 55%,#72b84e) 31%,color-mix(in srgb,var(--zc) 40%,#4b9a3b) 100%)}
#battle{isolation:isolate}
.btop{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}.btop .foe-n{color:#fff}
.blog{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);font-weight:600}
.bmon{background:rgba(255,255,255,.92);color:#1c1c1e}
.bctl{background:rgba(255,255,255,.95);color:#1c1c1e}
.skb{background:color-mix(in srgb,var(--c) 16%,#fff);color:#1c1c1e;box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000)}
.skb b{font:15px "Lilita One",system-ui;letter-spacing:.2px}
.bturn b,.bmsg b{font-family:"Lilita One",system-ui;font-weight:400;font-size:17px}

/* ===== v3 ===== */

.zbar{position:relative;height:16px;border-radius:8px;background:#3a3a3c;overflow:hidden;margin-top:6px}

.zbar.big{height:24px;border-radius:12px;box-shadow:0 0 0 2px #fff}.zbar.big em{font-size:13px;line-height:24px}
.hbar.cash{box-shadow:inset 0 0 0 2px #2a7a2a}.hbar .ico.c{background:#123a12;box-shadow:0 0 0 2px #6fdc4f;color:#8dff6a;font-weight:800}
.hbar.name{flex:1.3}.hbar.cash,.hbar.shrooms{flex:1;min-width:0}
.backb{flex:none;font:19px "Lilita One",system-ui;color:#fff;padding:7px 12px 7px 10px;border-radius:8px;background:linear-gradient(#ff6a5a,#c4231c);box-shadow:0 0 0 2px #fff,0 3px 6px rgba(0,0,0,.4)}
.backb::after{content:" ↩";color:#9fd0ff}
.zsel .tfield{height:auto;flex:1;min-height:calc(calc(100*var(--vh)) - 70px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:18px 12px}
.zcards{position:relative;z-index:3;display:flex;gap:10px;width:100%;max-width:560px}
.zcard{flex:1;border-radius:14px;background:#ee8a3a;box-shadow:0 0 0 2px #3a1a08,0 8px 20px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-direction:column}
.zc-h{display:flex;align-items:center;gap:6px;padding:8px;background:#f8e6b8;font:min(calc(4.6*var(--vw)),20px) "Lilita One",system-ui;color:#2a1a08}
.zart{height:min(calc(36*var(--vw)),170px);background:linear-gradient(180deg,color-mix(in srgb,var(--zc) 30%,#fff),color-mix(in srgb,var(--zc) 70%,#444));position:relative;overflow:hidden}
.za-m{position:absolute;bottom:-4%;width:58%}.za-m.l{left:-4%}.za-m.r{right:-6%;transform:scaleX(-1)}.za-m svg{width:100%;height:auto;animation:idle 2.4s ease-in-out infinite}
.zc-f{padding:8px;color:#fff;font:600 13px -apple-system,system-ui;text-align:center}
.zcard.mon{align-items:center;padding:10px 8px 12px}

.arr{width:28px;height:44px;border-radius:8px;background:rgba(0,0,0,.25);color:#fff;font-size:26px;line-height:40px}

.t-h{font:min(calc(4.6*var(--vw)),19px) "Lilita One",system-ui;margin-bottom:8px;color:#1a1408}

  addEventListener('load',function(){ booting=false; });

  function plan(){ if(document.hidden){ if(wake){ rCT(wake); wake=null; } return; } var now=Date.now(), next=Infinity, ok=fastOK();
    for(var k in jobs){ var j=jobs[k]; if(j.fast&&!ok) continue; if(j.due<next) next=j.due; }
    if(!ok){ var slow=now+500; if(slow<next) next=slow; } // look again soon so battle timers start promptly
    if(next===Infinity) return; var d=Math.max(0,next-now); if(wake&&wakeAt<=next) return; if(wake) rCT(wake); wakeAt=next; wake=rST(tick,d); }

      if(now>=j.due){ j.due=now+j.ms; try{ j.fn.apply(window,j.args); }catch(e){ setTimeout(function(){ throw e; }); } } }

let S = null;
function freshSave(){ return {v:1, name:'', mons:[], team:[], mush:10, energy:20, maxEnergy:20, energyAt:Date.now(), zones:{}, quests:{}, bonus:false, stats:{wins:0,arenaWins:0,pvpWins:0,evolves:0,hatches:0}, savedAt:0}; }
const LS_KEY='mk-remake-save';
let DB={ref:null, writing:false, dirty:false};
function loadLocal(){ try{ const t=localStorage.getItem(LS_KEY); return t?JSON.parse(t):null; }catch(e){ return null; } }
function persist(){
  S.savedAt=Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  clearTimeout(persist._t); persist._t=setTimeout(dbWrite, 800);
}
async function dbWrite(){
  if(!DB.ref) return;
  if(DB.writing){ DB.dirty=true; return; }
  DB.writing=true;
  try{ await DB.ref.set({v:1, savedAt:S.savedAt, save:JSON.stringify(S)}); }catch(e){}
  DB.writing=false;
  if(DB.dirty){ DB.dirty=false; dbWrite(); }
}
function parseDoc(r){
  try{
    if(!r) return null;
    let d = typeof r.data==='function' ? r.data() : r;
    if(d && !d.save && d.data && d.data.save) d=d.data;
    return d && d.save ? JSON.parse(d.save) : null;
  }catch(e){ return null; }
}
function withTimeout(p,ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej('timeout'),ms))]); }
async function initDb(){
  try{
    if(!window.claude || !window.claude.use) return;
    const db = await window.claude.use('db'); const user = await window.claude.use('user');
    if(!db || !user) return;
    const id = await user.id(); if(!id) return;
    DB.ref = db.collection('data/users/'+id).doc('save');
    const remote = parseDoc(await withTimeout(DB.ref.get(), 10000));
    if(remote && (!S || !S.name || (remote.savedAt||0) > (S.savedAt||0))){
      S = Object.assign(freshSave(), remote);
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      closeAllSheets(); render();
      if(!S.name) onboarding();
      NET.updatePresence && NET.updatePresence();
    } else if(S && S.name) dbWrite();
  }catch(e){}
}

// ===== ENERGY =====
function tickEnergy(){
  const now=Date.now();
  if(S.energy>=S.maxEnergy){ S.energyAt=now; return; }
  const g=Math.floor((now-S.energyAt)/ENERGY_REGEN);
  if(g>0){ S.energy=Math.min(S.maxEnergy,S.energy+g); S.energyAt+=g*ENERGY_REGEN; if(S.energy>=S.maxEnergy) S.energyAt=now; }
}
function nextEnergyIn(){ const ms=ENERGY_REGEN-(Date.now()-S.energyAt); const s=Math.max(0,Math.ceil(ms/1000)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; }
function spend(n){ tickEnergy(); if(S.energy<n){ toast(`Not enough energy · +1 in ${nextEnergyIn()}`); return false; } if(S.energy>=S.maxEnergy) S.energyAt=Date.now(); S.energy-=n; return true; }

// ===== MONSTERS =====
function addMon(sp,lvl){ const m={uid:uidGen(), sp, lvl, xp:0}; S.mons.push(m); return m; }
function monBy(uid){ return S.mons.find(m=>m.uid===uid); }
function teamMons(){ return S.team.map(monBy).filter(Boolean); }
function highLvl(){ return S.mons.reduce((a,m)=>Math.max(a,m.lvl),1); }
function teamPower(){ return teamMons().reduce((t,m)=>t+power(m.sp,m.lvl),0); }
function giveXp(m, amt){
  if(m.lvl>=MAXLVL) return {lv:0,evo:false};
  const st0=stageOf(m.lvl), l0=m.lvl; m.xp+=amt;
  while(m.lvl<MAXLVL && m.xp>=xpNeed(m.lvl)){ m.xp-=xpNeed(m.lvl); m.lvl++; }
  if(m.lvl>=MAXLVL) m.xp=0;
  const evo = stageOf(m.lvl)>st0; if(evo) S.stats.evolves++;
  return {lv:m.lvl-l0, evo};
}

function sheet(html, opts={}){
  const wrap=document.createElement('div'); wrap.className='sheet-wrap';
  wrap.innerHTML=`<div class="sheet-bg"></div><div class="sheet ${opts.cls||'panel'}">${opts.locked?'':'<button class="sheet-x" aria-label="Close">✕</button>'}<div class="sheet-body">${html}</div></div>`;
  $('#sheets').appendChild(wrap);
  const panel=wrap.querySelector('.sheet');
  requestAnimationFrame(()=>requestAnimationFrame(()=>wrap.classList.add('open')));
  let closed=false;
  const close=()=>{ if(closed) return; closed=true; wrap.classList.remove('open'); panel.style.transform=''; setTimeout(()=>wrap.remove(),300); opts.onClose&&opts.onClose(); };
  wrap.close=close;
  if(!opts.locked){
    wrap.querySelector('.sheet-bg').onclick=close;
    wrap.querySelector('.sheet-x').onclick=close;
  }
  if(!opts.locked && opts.drag){
    let x0=null,y0=0,dx=0,drag=false;
    panel.addEventListener('pointerdown',e=>{ if(e.target.closest('input,textarea')) return; x0=e.clientX; y0=e.clientY; dx=0; drag=false; });
    panel.addEventListener('pointermove',e=>{
      if(x0===null) return; const ddx=e.clientX-x0, ddy=e.clientY-y0;
      if(!drag && ddx>10 && Math.abs(ddx)>Math.abs(ddy)*1.2){ drag=true; panel.classList.add('dragging'); try{panel.setPointerCapture(e.pointerId);}catch(_){} }
      if(drag){ dx=Math.max(0,ddx); panel.style.transform=`translateX(${dx}px)`; e.preventDefault(); }
    });
    const end=()=>{ if(x0===null) return; x0=null; panel.classList.remove('dragging'); if(drag){ if(dx>90) close(); else panel.style.transform=''; } drag=false; };
    panel.addEventListener('pointerup',end); panel.addEventListener('pointercancel',end);
    panel.addEventListener('click',e=>{ if(drag||dx>10){ e.stopPropagation(); e.preventDefault(); dx=0; } },true);
  }
  return {body:wrap.querySelector('.sheet-body'), close};
}
function closeAllSheets(){ document.querySelectorAll('.sheet-wrap').forEach(w=>w.close&&w.close()); }

  if(!S) return;
  tickEnergy();
  renderTop();

  v.innerHTML = TAB==='map'?viewMap(): TAB==='team'?viewTeam(): TAB==='arena'?viewArena(): viewQuests();

function renderTop(){

// ===== MAP =====
function zoneUnlocked(i){ return i===0 || (S.zones[ZONES[i-1].id]||0)>=4; }
function viewMap(){
  return `<h1>World Map</h1><div class="zones">${ZONES.map((z,i)=>{
    const done=S.zones[z.id]||0, open=zoneUnlocked(i); const rep=SP.filter(s=>s.fam===z.fam)[0];
    return `<button class="zone ${open?'':'locked'}" data-zone="${i}" style="--zc:${z.c}">
      <div class="zone-art">${monSVG(rep.id, done>=4?20:1)}</div>
      <div class="zone-info"><b>${z.n}</b><span>${FAM[z.fam].n} · Lv ${z.lv}+</span>
      <div class="dots">${[0,1,2,3].map(s=>`<i class="${s<done?'on':''} ${s===3?'boss':''}"></i>`).join('')}</div></div>
      <div class="zone-go">${open?(done>=4?'✓':'›'):'🔒'}</div></button>`; }).join('')}</div>`;
}
function stageTeam(zi, s){
  const z=ZONES[zi]; const r=seeded(hashStr(z.id+s)); const fam=SP.filter(x=>x.fam===z.fam);
  const n=z.sizes[s]; const lvl=z.lv+s+(s===3?2:0); const mons=[];
  for(let k=0;k<n;k++){
    let pool=fam; if(s>=2 && k===n-1 && zi>0){ pool=SP.filter(x=>x.fam!==z.fam); }
    mons.push({sp:pool[Math.floor(r()*pool.length)].id, lvl: Math.max(1, lvl - (k&&s<3?1:0)), hpMul: zi===0?[0.6,0.7,0.75,0.85][s]:undefined});
  }
  return {name: s===3?`${z.n} Boss`:'Wild monsters', mons};
}
function openZone(zi){
  const z=ZONES[zi];
  if(!zoneUnlocked(zi)){ toast(`Clear ${ZONES[zi-1].n} first`); return; }
  const done=S.zones[z.id]||0;
  const sh=sheet(`<h2>${z.n}</h2><p class="muted">Home of the ${FAM[z.fam].n}. Beat the boss to befriend one.</p>
    <div class="stages">${[0,1,2,3].map(s=>{ const t=stageTeam(zi,s); const open=s<=done;
      return `<div class="stage ${open?'':'locked'}"><div class="stage-mons">${t.mons.map(m=>monSVG(m.sp,m.lvl)).join('')}</div>
      <div class="stage-info"><b>${s===3?'Boss':STAGE_LABEL[s]} ${s<done?'<span class="ok">✓</span>':''}</b><span>${t.mons.length}× · Lv ${Math.min(...t.mons.map(m=>m.lvl))}–${Math.max(...t.mons.map(m=>m.lvl))}</span></div>
      <button class="btn sm" data-stage="${s}" ${open?'':'disabled'}>Battle · 2⚡</button></div>`; }).join('')}</div>`);
  sh.body.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{
    if(!S.team.length){ toast('Add a monster to your team'); return; }
    if(!spend(2)){ return; }
    persist(); sh.close(); const s=+b.dataset.stage;
    startBattle({mode:'campaign', foe:stageTeam(zi,s), meta:{zi,s}});
  });
}

// ===== TEAM =====
function monCard(m, extra){
  const sp=SPI[m.sp];
  return `<button class="mcard" data-mon="${m.uid}">${monSVG(m.sp,m.lvl)}<b>${sp.n}</b><span>Lv ${m.lvl} · ${STAGE_N[stageOf(m.lvl)]}</span>${extra||''}<i class="eldot" style="background:${EL[FAM[sp.fam].el].c}"></i></button>`;
}
function viewTeam(){
  const tm=teamMons();
  const slots=[0,1,2].map(i=>tm[i]?monCard(tm[i],'<em class="tslot">'+(i+1)+'</em>'):`<div class="mcard empty"><span>Empty slot</span></div>`).join('');
  const rest=S.mons.filter(m=>!S.team.includes(m.uid)).sort((a,b)=>b.lvl-a.lvl);
  return `<h1>Monsters</h1><div class="sec-h"><h3>Team</h3><span class="muted">Power ${teamPower()}</span></div>
    <div class="grid3">${slots}</div>
    <button class="hatch" id="hatch"><div class="egg"></div><div><b>Hatch a random monster</b><span>10 🍄 · You have ${S.mush}</span></div><span class="zone-go">›</span></button>
    <div class="sec-h"><h3>Collection</h3><span class="muted">${new Set(S.mons.map(m=>m.sp)).size} of ${SP.length} kinds found</span></div>
    <div class="grid3">${rest.map(m=>monCard(m)).join('')||'<p class="muted">Monsters you befriend show up here.</p>'}</div>`;
}
function openMon(uid){
  const m=monBy(uid); if(!m) return; const sp=SPI[m.sp]; const fam=FAM[sp.fam]; const s=statsOf(m.sp,m.lvl);
  const inTeam=S.team.includes(uid); const slots=slotsOf(m.lvl);
  const unlock=[1,1,5,12];
  const evoAt = m.lvl<10?10: m.lvl<20?20:null;
  const sh=sheet(`<div class="mon-hero" style="--c:${EL[fam.el].c}">${monSVG(m.sp,m.lvl)}</div>
    <h2>${sp.n}</h2><p class="muted">${fam.n} · ${STAGE_N[stageOf(m.lvl)]} ${elChip(fam.el)}</p>
    <div class="lvrow"><b>Lv ${m.lvl}</b>${m.lvl<MAXLVL?bar(m.xp,xpNeed(m.lvl),'xp')+`<span class="muted">${m.xp}/${xpNeed(m.lvl)} XP</span>`:'<span class="muted">Max level</span>'}</div>
    ${evoAt?`<p class="muted small">Evolves at Lv ${evoAt}</p>`:''}
    <div class="stats"><div><span>Life</span><b>${s.hp}</b></div><div><span>Attack</span><b>${s.atk}</b></div><div><span>Mana</span><b>${s.mp}</b></div></div>
    <h3>Skills</h3><div class="skills">${sp.sk.map((id,i)=>{ const k=SK[id]; const locked=i>=slots;
      return `<div class="skill ${locked?'locked':''}"><i style="background:${EL[k.el].c}"></i><div><b>${k.n}</b><span>${locked?`Unlocks at Lv ${unlock[i]}`:skillDesc(id)}</span></div><em>${k.mp}</em></div>`; }).join('')}</div>
    <div class="actions" id="tact"></div>`);
  const tact=sh.body.querySelector('#tact');
  if(inTeam){ tact.innerHTML=`<button class="btn ghost" id="rm" ${S.team.length<=1?'disabled':''}>Remove from team</button>`;
    tact.querySelector('#rm').onclick=()=>{ S.team=S.team.filter(x=>x!==uid); persist(); sh.close(); render(); }; }
  else if(S.team.length<3){ tact.innerHTML=`<button class="btn" id="add">Add to team</button>`;
    tact.querySelector('#add').onclick=()=>{ S.team.push(uid); persist(); sh.close(); render(); }; }
  else { tact.innerHTML=`<p class="muted small">Swap into your team:</p><div class="swap">${teamMons().map(t=>`<button class="btn ghost sm" data-sw="${t.uid}">Replace ${SPI[t.sp].n}</button>`).join('')}</div>`;
    tact.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{ S.team=S.team.map(x=>x===b.dataset.sw?uid:x); persist(); sh.close(); render(); }); }
}
function hatch(){
  if(S.mush<10){ toast('You need 10 🍄'); return; }
  S.mush-=10; S.stats.hatches++;
  const sp=(P=>P[Math.floor(Math.random()*P.length)])(EGGSP()); const lvl=Math.max(1,Math.floor(highLvl()*0.6));
  const m=addMon(sp.id,lvl); if(S.team.length<3) S.team.push(m.uid);
  persist(); render();
  reveal(m,'Your egg hatched!');
}
function reveal(m,title){
  const sp=SPI[m.sp];
  const sh=sheet(`<div class="reveal"><p class="muted">${title}</p><div class="mon-hero pop" style="--c:${EL[FAM[sp.fam].el].c}">${monSVG(m.sp,m.lvl)}</div><h2>${sp.n}</h2><p class="muted">${FAM[sp.fam].n} · Lv ${m.lvl} ${elChip(FAM[sp.fam].el)}</p>
    <button class="btn" id="ok">Nice!</button></div>`);
  sh.body.querySelector('#ok').onclick=sh.close;
}

// ===== QUESTS =====
function viewQuests(){
  const all=QUESTS.every(q=>S.quests[q.id]);
  return `<h1>Quests</h1><p class="muted">Finish every quest for <b>+5 max energy</b> and a full refill.</p>
   <div class="list">${QUESTS.map(q=>{ const c=!!S.quests[q.id], ok=q.ok(S);
    return `<div class="row ${c?'done':''}"><div><b>${q.n}</b><span>Reward ${q.r} 🍄</span></div>${c?'<span class="ok">✓</span>':ok?`<button class="btn sm" data-q="${q.id}">Claim</button>`:'<span class="muted small">In progress</span>'}</div>`; }).join('')}</div>
   ${all?`<p class="center muted">All quests complete — max energy ${S.maxEnergy}.</p>`:''}`;
}
function claim(id){
  const q=QUESTS.find(x=>x.id===id); if(!q||S.quests[id]||!q.ok(S)) return;
  S.quests[id]=true; S.mush+=q.r; toast(`+${q.r} 🍄`);
  if(!S.bonus && QUESTS.every(x=>S.quests[x.id])){ S.bonus=true; S.maxEnergy+=5; S.energy=S.maxEnergy; S.energyAt=Date.now(); setTimeout(()=>toast('All quests done! +5 max energy'),600); }
  persist(); render();
}

function viewArena(){
  const peers=NET.peers.filter(p=>!p.me);
  let live;
  if(NET.status==='off') live=`<p class="muted small">Live battles are available when this game is opened from its Claude link.</p>`;
  else if(NET.status==='connecting') live=`<p class="muted small">Connecting…</p>`;
  else live = peers.length? `<div class="list">${peers.map(p=>`<div class="row"><div><b>${esc(p.name||'Trainer')}</b><span>Power ${p.power|0}${p.busy?' · in a battle':''}</span></div><button class="btn sm" data-ch="${esc(p.cid)}" ${p.busy||NET.pending?'disabled':''}>Challenge</button></div>`).join('')}</div>`
     : `<p class="muted small">No one else is in the arena right now. Send this page to a friend — when they open it, they'll show up here.</p>`;
  return `<h1>Arena</h1>
    <div class="card"><div class="card-h"><h3>Live 3v3</h3><span class="live ${NET.status==='on'?'on':''}">${NET.status==='on'?'● Online':'○ Offline'}</span></div>${live}</div>
    <div class="card tap" id="rival"><div class="card-h"><h3>Rival battle</h3><span class="muted">1⚡</span></div><p class="muted small">3v3 against a computer trainer at your level.</p></div>
    <div class="card tap" id="local"><div class="card-h"><h3>Pass &amp; play</h3><span class="muted">Free</span></div><p class="muted small">Two players, one phone. Pick both teams from your collection.</p></div>`;
}
function rivalTeam(){
  const tm=teamMons(); const avg=Math.round(tm.reduce((t,m)=>t+m.lvl,0)/Math.max(1,tm.length));
  const names=['Rival Nour','Rival Sami','Rival Maya','Rival Karim','Rival Lina'];
  return {name:names[Math.floor(Math.random()*names.length)], mons:[0,1,2].map(()=>({sp:(P=>P[Math.floor(Math.random()*P.length)])(EGGSP()).id, lvl:Math.max(1,avg+Math.floor(Math.random()*3)-1)}))};
}
function openLocal(){
  if(S.mons.length<1) return;
  let pick=[];
  const sh=sheet(`<h2>Pass &amp; play</h2><p class="muted">Player 1 uses your team. Pick up to 3 for Player 2.</p><div class="grid3" id="lp">${S.mons.map(m=>monCard(m)).join('')}</div><div class="actions"><button class="btn" id="go" disabled>Start battle</button></div>`);
  const g=sh.body.querySelector('#lp'); const go=sh.body.querySelector('#go');
  g.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>{ const u=b.dataset.mon; if(pick.includes(u)) pick=pick.filter(x=>x!==u); else if(pick.length<3) pick.push(u); g.querySelectorAll('[data-mon]').forEach(x=>x.classList.toggle('sel',pick.includes(x.dataset.mon))); go.disabled=!pick.length; });
  go.onclick=()=>{ sh.close(); startBattle({mode:'local', foe:{name:'Player 2', mons:pick.map(monBy).map(m=>({sp:m.sp,lvl:m.lvl}))}, myName:'Player 1'}); };
}

function bindView(){
  const v=$('#view');
  v.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>openZone(+b.dataset.zone));
  v.querySelectorAll('[data-mon]').forEach(b=>b.onclick=()=>openMon(b.dataset.mon));
  v.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>claim(b.dataset.q));
  v.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>NET.challenge(b.dataset.ch));
  const h=$('#hatch',v); if(h) h.onclick=hatch;
  const r=$('#rival',v); if(r) r.onclick=()=>{ if(!S.team.length) return toast('Add a monster to your team'); if(!spend(1)) return; persist(); startBattle({mode:'rival', foe:rivalTeam()}); };
  const l=$('#local',v); if(l) l.onclick=openLocal;
}

// ===== BATTLE =====
let B=null;
function mySnap(){ return teamMons().map(m=>({sp:m.sp,lvl:m.lvl,uid:m.uid})); }
function startBattle({mode, foe, meta, myName}){
  const b=newBattle({name:myName||S.name, mons:mySnap()}, foe, {mode});
  B={b, mode, meta:meta||{}, mySide:0, ctl:['human', mode==='local'?'human':'ai'], sel:null};
  openBattle(); NET.updatePresence(); drive();
}
function openBattle(){ closeAllSheets(); document.querySelectorAll('.lila-wrap').forEach(x=>x.remove()); $('#battle').classList.add('open'); document.body.classList.add('inbattle'); }
function closeBattle(){ $('#battle').classList.remove('open'); document.body.classList.remove('inbattle'); clearTimeout(B&&B.timer); B=null; render(); NET.updatePresence(); }
function drive(){
  if(!B) return; const b=B.b;
  clearTimeout(B.timer);
  renderBattle();
  if(!b) return;
  if(b.over){ if(!B.finished){ B.finished=true; B.timer=setTimeout(finishBattle, 1100); } return; }
  const a=actor(b); const c=B.ctl[a.s];
  if(c==='ai') B.timer=setTimeout(()=>{ if(!B||B.b!==b) return; act(b, aiChoose(b)); afterAct(); }, 1450);
}
function afterAct(){ if(B.net && B.net.role==='host') NET.broadcast(); drive(); }
function humanAct(skill, target){
  const b=B.b; B.sel=null;
  if(B.net && B.net.role==='guest'){ NET.sendAction({skill,target}); renderBattle(); return; }
  act(b,{skill,target}); afterAct();
}
function bcard(b, s, i, ctx){
  const m=b.sides[s].mons[i]; const a=actor(b);
  const isAct = !b.over && a && a.s===s && a.i===i;
  const st=m.st; const chips=[];
  if(st.burn) chips.push('<i class="st burn">Burn</i>'); if(st.poison) chips.push('<i class="st poison">Poison</i>');
  if(st.stun) chips.push('<i class="st stun">Stun</i>'); if(st.bubble) chips.push('<i class="st bubble">Bubble</i>');
  if(st.mshield) chips.push('<i class="st ms">M.Shield</i>'); if(st.atkUp) chips.push('<i class="st up">Atk↑</i>');
  if(st.defUp) chips.push('<i class="st guard">Guard</i>'); if(st.thorns) chips.push('<i class="st spark">Spark</i>');
  const tgt = ctx.targets && ctx.targets.side===s && ctx.targets.list.includes(i);
  const pv = ctx.prev && ctx.prev[s+'-'+i]; const hp=pv?pv.hp:m.hp, mp=pv?pv.mp:m.mp;
  return `<div class="bmon ${hp<=0?'ko':''} ${isAct?'acting':''} ${tgt?'target':''}" data-s="${s}" data-i="${i}">
    <div class="bart">${monSVG(m.sp,m.lvl)}</div><div class="bname"><b>${m.n}</b><span>Lv${m.lvl}</span></div>
    ${bar(hp,m.maxhp,'hp')}${bar(mp,m.maxmp,'mp')}<div class="bnum">${hp}/${m.maxhp}</div><div class="sts">${chips.join('')}</div></div>`;
}
function renderBattle(){
  const root=$('#battle'); if(!B) return;
  const b=B.b;
  if(!b){ root.innerHTML=`<div class="bwait"><div class="spinner"></div><p>Joining battle…</p><button class="btn ghost sm" id="bleave">Leave</button></div>`; $('#bleave').onclick=()=>{ NET.leaveMatch(); closeBattle(); }; return; }
  const a=actor(b);
  const myTurn = !b.over && a && B.ctl[a.s]==='human' && !(B.net && B.net.role==='guest' && B.net.sent===b.seq);
  const bottom = B.mySide, top=1-bottom;
  let ctx={}; const animating = B.animSeq!==b.seq && B.prev; if(animating) ctx.prev=B.prev;
  if(myTurn && B.sel){ const vt=validTargets(b,a.s,B.sel); const tside = SK[B.sel].t==='enemy'?1-a.s:a.s; ctx.targets={side:tside, list:vt}; }
  let controls='';
  if(b.over) controls=`<div class="bmsg">${b.winner===B.mySide||B.mode==='local'?`<b>${esc(b.sides[b.winner].name)} wins!</b>`:'<b>Defeated</b>'}</div>`;
  else if(myTurn){
    const m=a.m; const opts=['basic'].concat(m.sk);
    const who = B.mode==='local'?`${esc(b.sides[a.s].name)} · `:'';
    if(B.sel){ controls=`<div class="bmsg"><b>${SK[B.sel].n}</b> — tap a ${SK[B.sel].t==='ally'?'teammate':'target'}</div><button class="btn ghost sm" id="cancel">Back</button>`; }
    else controls=`<div class="bturn">${who}<b>${m.n}</b>'s turn</div><div class="skgrid">${opts.map(id=>{ const k=SK[id]; const can=m.mp>=k.mp;
      return `<button class="skb" data-sk="${id}" ${can?'':'disabled'} style="--c:${EL[k.el].c}"><b>${k.n}</b><span>${k.mp?k.mp+' mana':'free'}</span></button>`; }).join('')}</div>`;
  } else {
    const nm = a? a.m.n : '';
    controls=`<div class="bmsg muted">${B.net?(B.ctl[a.s]==='remote'?`Waiting for ${esc(b.sides[a.s].name)}…`:'Sending…'):`${nm} is thinking…`}</div>`;
  }
  const last=b.log.slice(-2).map(esc).join('<br>');
  root.style.setProperty('--zc', B.mode==='campaign'?ZONES[B.meta.zi].c:'#7ccf6a');
  root.innerHTML=`<div class="bsky"></div><div class="btop"><button class="iconb" id="bquit">✕</button><span>${B.mode==='pvp'?'Live 3v3':B.mode==='local'?'Pass & play':B.mode==='rival'?'Rival battle':ZONES[B.meta.zi].n} · Round ${b.round}</span><span class="foe-n">${esc(b.sides[top].name)}</span></div>
    <div class="brow foe">${b.sides[top].mons.map((m,i)=>bcard(b,top,i,ctx)).join('')}</div>
    <div class="blog">${last}</div>
    <div class="brow me">${b.sides[bottom].mons.map((m,i)=>bcard(b,bottom,i,ctx)).join('')}</div>
    <div class="bctl">${controls}</div>`;
  // bindings
  $('#bquit').onclick=()=>{
    if(b.over){ finishBattle(); return; }
    const sh=sheet(`<h2>${B.mode==='pvp'?'Forfeit match?':'Run away?'}</h2><p class="muted">${B.mode==='pvp'?'Your opponent gets the win.':'You won\'t get rewards for this battle.'}</p><div class="actions"><button class="btn danger" id="y">${B.mode==='pvp'?'Forfeit':'Run'}</button></div>`);
    sh.body.querySelector('#y').onclick=()=>{ sh.close(); if(B.net){ NET.forfeit(); } else closeBattle(); };
  };
  root.querySelectorAll('[data-sk]').forEach(btn=>btn.onclick=()=>{
    const id=btn.dataset.sk; const t=SK[id].t;
    if(t==='enemy'||t==='ally'){ const vt=validTargets(b,a.s,id); if(vt.length===1) humanAct(id,vt[0]); else { B.sel=id; renderBattle(); } }
    else humanAct(id,null);
  });
  const c=$('#cancel'); if(c) c.onclick=()=>{ B.sel=null; renderBattle(); };
  if(ctx.targets) root.querySelectorAll('.bmon.target').forEach(el=>el.onclick=()=>humanAct(B.sel,+el.dataset.i));
  if(B.animSeq!==b.seq){ B.animSeq=b.seq; animateBattle(root,b,animating); }
}
function finishBattle(){
  if(!B) return; const b=B.b; const mode=B.mode;
  if(B.net) NET.leaveMatch();
  if(mode==='local'){ closeBattle(); return; }
  const win = b.over && b.winner===B.mySide;
  const foeSide=1-B.mySide;
  const avg=b.sides[foeSide].mons.reduce((t,m)=>t+m.lvl,0)/b.sides[foeSide].mons.length;
  let xp=Math.round((15+avg*7)*(win?1:0.3)); let mush=0; const extra=[];
  if(win){
    S.stats.wins++;
    if(mode==='campaign'){ const z=ZONES[B.meta.zi]; const s=B.meta.s; const first=(S.zones[z.id]||0)<=s;
      mush=1+Math.floor(B.meta.zi/2)+(s===3&&first?5:0);
      if(first) S.zones[z.id]=s+1;
      if(first && z.id==='meadow' && s===0){ const sp=SP.filter(x=>x.fam==='bug')[Math.floor(Math.random()*4)]; const m=addMon(sp.id,2); if(S.team.length<3) S.team.push(m.uid); extra.push(['Lila gave you a buddy!',m]); }
      if(first && s===3){ let fam=z.fam; if(z.id==='meadow'){ const others=Object.keys(FAM).filter(f=>f!=='bug'&&!S.mons.some(m=>SPI[m.sp].fam===f)); fam=others[Math.floor(Math.random()*others.length)]||'wing'; }
        const owned=new Set(S.mons.map(m=>m.sp)); let pool=SP.filter(x=>x.fam===fam&&!owned.has(x.id)); if(!pool.length) pool=SP.filter(x=>x.fam===fam);
        const m=addMon(pool[Math.floor(Math.random()*pool.length)].id, Math.max(1,z.lv)); if(S.team.length<3) S.team.push(m.uid); extra.push([`You befriended a monster from ${z.n}!`,m]); }
    } else if(mode==='rival'){ mush=3; S.stats.arenaWins++; }
    else if(mode==='pvp'){ mush=5; S.stats.arenaWins++; S.stats.pvpWins++; xp=Math.round(xp*1.3); }
  }
  S.mush+=mush;
  const res = b.sides[B.mySide].mons.map((bm,i)=>{ const m=monBy(bm.uid||(B.myUids&&B.myUids[i])); if(!m) return null; const r=giveXp(m,xp); return {m,r}; }).filter(Boolean);
  persist();
  closeBattle();
  const sh=sheet(`<div class="result"><h2>${win?'Victory!':'Defeat'}</h2><p class="muted">+${xp} XP each${mush?` · +${mush} 🍄`:''}</p>
    <div class="list">${res.map(({m,r})=>`<div class="row"><div class="rmon">${monSVG(m.sp,m.lvl)}</div><div class="grow"><b>${SPI[m.sp].n} · Lv ${m.lvl}</b>${m.lvl<MAXLVL?bar(m.xp,xpNeed(m.lvl),'xp'):''}</div>${r.evo?'<span class="tag evo">Evolved!</span>':r.lv?`<span class="tag">+${r.lv} Lv</span>`:''}</div>`).join('')}</div>
    <button class="btn" id="ok">Continue</button></div>`, {onClose:()=>{ extra.forEach(([t,m],k)=>setTimeout(()=>reveal(m,t),350+k*50)); }});
  sh.body.querySelector('#ok').onclick=sh.close;
}

// ===== NET (live PvP) =====
const NET = {status:'off', peers:[], cid:uidGen()+uidGen(), room:null, pending:null, mr:null};
NET.init = async function(){
  if(!window.claude || !window.claude.use) return;
  NET.status='connecting'; if(TAB==='arena') render();
  let room=null; try{ room = await window.claude.use('room'); }catch(e){}
  if(!room){ NET.status='off'; if(TAB==='arena') render(); return; }
  NET.room=room; NET.status='on';
  try{ room.onPeers(list=>{ NET.peers=(list||[]).map(p=>{ const d=p.presence||p.state||p.data||p; return Object.assign({},d,{me: !!(p.you||p.self||p.isSelf||p.me) || d.cid===NET.cid}); }).filter(p=>p.cid); if(TAB==='arena' && !B) render(); }); }catch(e){}
  room.on('challenge', d=>{ if(!d||d.to!==NET.cid) return; if(B||NET.incoming){ room.emit('decline',{to:d.from, matchId:d.matchId, busy:true}); return; } NET.showIncoming(d); });
  room.on('accept', d=>{ if(!d||d.to!==NET.cid||!NET.pending||d.matchId!==NET.pending.matchId) return; clearTimeout(NET.pending.t); NET.pending=null; NET.startHost(d); });
  room.on('decline', d=>{ if(!d||d.to!==NET.cid||!NET.pending||d.matchId!==NET.pending.matchId) return; clearTimeout(NET.pending.t); NET.pending=null; toast(d.busy?'They\'re busy right now':'Challenge declined'); render(); });
  NET.updatePresence();
  if(TAB==='arena') render();
};
NET.updatePresence = function(){ if(!NET.room||!S) return; try{ NET.room.presence({cid:NET.cid, name:S.name||'Trainer', power:teamPower(), busy:!!B}); }catch(e){} };
function sanitizeTeam(t){ return (Array.isArray(t)?t:[]).slice(0,3).filter(m=>m&&SPI[m.sp]).map(m=>({sp:m.sp, lvl:Math.max(1,Math.min(MAXLVL,m.lvl|0))})); }
NET.challenge = function(cid){
  if(!S.team.length) return toast('Add a monster to your team');
  const matchId=uidGen()+uidGen();
  NET.pending={matchId,to:cid,t:setTimeout(()=>{ NET.pending=null; toast('No answer'); render(); },30000)};
  NET.room.emit('challenge',{to:cid, from:NET.cid, name:S.name, matchId, team:mySnap().map(({sp,lvl})=>({sp,lvl}))});
  toast('Challenge sent'); render();
};
NET.showIncoming = function(d){
  const team=sanitizeTeam(d.team); NET.incoming=d;
  const sh=sheet(`<h2>Challenge!</h2><p class="muted"><b>${esc(d.name||'A trainer')}</b> wants a 3v3 battle.</p><div class="stage-mons big">${team.map(m=>monSVG(m.sp,m.lvl)).join('')}</div>
    <div class="actions"><button class="btn" id="acc">Accept</button><button class="btn ghost" id="dec">Decline</button></div>`, {onClose:()=>{ if(NET.incoming===d){ NET.incoming=null; NET.room.emit('decline',{to:d.from, matchId:d.matchId}); } }});
  const t=setTimeout(()=>sh.close(),28000);
  sh.body.querySelector('#acc').onclick=()=>{ clearTimeout(t); NET.incoming=null; sh.close();
    if(!S.team.length){ toast('Add a monster to your team'); return; }
    NET.room.emit('accept',{to:d.from, from:NET.cid, name:S.name, matchId:d.matchId, team:mySnap().map(({sp,lvl})=>({sp,lvl}))});
    NET.startGuest(d); };
  sh.body.querySelector('#dec').onclick=()=>{ clearTimeout(t); sh.close(); };
};
async function joinMatch(id){ const r=NET.room.join('m-'+id); return (r && r.then)? await r : r; }
NET.startHost = async function(d){
  closeAllSheets();
  const mr=await joinMatch(d.matchId); NET.mr=mr;
  const b=newBattle({name:S.name, mons:mySnap()}, {name:d.name||'Opponent', mons:sanitizeTeam(d.team)}, {mode:'pvp'});
  B={b, mode:'pvp', meta:{}, mySide:0, ctl:['human','remote'], net:{role:'host', matchId:d.matchId, last:Date.now()}};
  mr.on('action', a=>{
    if(!B||!B.net||a.matchId!==B.net.matchId||B.b.over) return;
    const ac=actor(B.b);
    if(ac.s===1 && a.seq===B.b.seq){ act(B.b,{skill:a.skill,target:a.target}); B.net.last=Date.now(); afterAct(); }
    else NET.broadcast();
  });
  mr.on('forfeit', a=>{ if(!B||!B.net||a.matchId!==B.net.matchId||B.b.over) return; B.b.over=true; B.b.winner=0; B.b.log.push(`${B.b.sides[1].name} forfeited.`); B.b.seq++; NET.broadcast(); drive(); });
  B.net.hb=setInterval(()=>{
    if(!B||!B.net) return; NET.broadcast();
    const ac=actor(B.b);
    if(!B.b.over && ac && ac.s===1 && Date.now()-B.net.last>60000){ act(B.b, aiChoose(B.b)); B.net.last=Date.now(); afterAct(); }
  },2500);
  openBattle(); NET.updatePresence(); NET.broadcast(); drive();
};
NET.broadcast = function(){ if(!NET.mr||!B||!B.b||!B.net) return; const b=Object.assign({},B.b,{log:B.b.log.slice(-6)}); try{ NET.mr.emit('state',{matchId:B.net.matchId, b}); }catch(e){} if(B.net.lastSeq!==B.b.seq){ B.net.last=Date.now(); B.net.lastSeq=B.b.seq; } };
NET.startGuest = async function(d){
  B={b:null, mode:'pvp', meta:{}, mySide:1, myUids:teamMons().map(m=>m.uid), ctl:['remote','human'], net:{role:'guest', matchId:d.matchId, heard:Date.now()}};
  openBattle(); renderBattle();
  const mr=await joinMatch(d.matchId); NET.mr=mr;
  mr.on('state', s=>{
    if(!B||!B.net||!s||s.matchId!==B.net.matchId||!s.b) return;
    B.net.heard=Date.now();
    if(!B.b || s.b.seq>B.b.seq || (s.b.over&&!B.b.over)){ B.b=s.b; B.net.sent=null; drive(); }
  });
  B.net.hb=setInterval(()=>{
    if(!B||!B.net) return;
    if(B.net.sent!=null && B.b && B.b.seq===B.net.sent && B.net.action) mr.emit('action',Object.assign({matchId:B.net.matchId, seq:B.net.sent},B.net.action));
    if(Date.now()-B.net.heard>25000 && !(B.b&&B.b.over)){ clearInterval(B.net.hb); toast('Lost connection to the match'); NET.leaveMatch(); closeBattle(); }
  },2500);
  NET.updatePresence();
};
NET.sendAction = function(a){ B.net.sent=B.b.seq; B.net.action=a; NET.mr.emit('action',Object.assign({matchId:B.net.matchId, seq:B.b.seq},a)); };
NET.forfeit = function(){
  if(!B||!B.net) return;
  if(B.net.role==='guest'){ try{ NET.mr.emit('forfeit',{matchId:B.net.matchId}); }catch(e){} if(B.b){ B.b.over=true; B.b.winner=0; } NET.leaveMatch(); closeBattle(); }
  else { B.b.over=true; B.b.winner=1; B.b.fled=0; B.b.seq++; NET.broadcast(); NET.leaveMatch(); closeBattle(); }
};
NET.leaveMatch = function(){ if(B&&B.net){ clearInterval(B.net.hb); } const mr=NET.mr; if(B&&B.net&&B.net.role==='host'&&B.b&&B.b.over&&mr){ const msg={matchId:B.net.matchId, b:Object.assign({},B.b,{log:B.b.log.slice(-6)})}; [0,500,1000].forEach(t=>setTimeout(()=>{ try{ mr.emit('state',msg); }catch(e){} },t)); } NET.mr=null; setTimeout(()=>{ try{ mr&&mr.leave&&mr.leave(); }catch(e){} },1500); if(B) B.net=null; setTimeout(NET.updatePresence,50); };

function boot(){
  S = Object.assign(freshSave(), loadLocal()||{});

  try{ fixTeam(); }catch(e){ console.warn('fixTeam',e&&e.message); }

// ===== BATTLE ANIMATION =====
function cardCenter(el){ const r=el.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height*0.32]; }
function animateBattle(root,b,animating){
  const evs=b.ev||[]; const card=(s,i)=>root.querySelector(`.bmon[data-s="${s}"][data-i="${i}"] `)||root.querySelector(`.bmon[data-s="${s}"][data-i="${i}"]`);
  const actE=evs.find(e=>e.k==='act'); const sk=actE&&SK[actE.sk];
  const actIdx=actE?evs.indexOf(actE):-1;
  const own=evs.filter((e,k)=>k>actIdx && (k<=actIdx || true)); // events after act
  let T=0;
  if(actE){
    const ac=card(actE.s,actE.i);
    const hits=evs.filter(e=>e.k==='hit' && e.s!==actE.s);
    const ranged = sk.pow && sk.el!=='neutral';
    if(ac){
      if(sk.pow){ ac.classList.add(actE.s===B.mySide?'lunge-up':'lunge-down'); }
      else ac.classList.add('cast');
    }
    if(ranged && ac){
      T=470;
      const [x0,y0]=cardCenter(ac); const seen=new Set();
      hits.forEach(h=>{ const key=h.s+'-'+h.i; if(seen.has(key)) return; seen.add(key); const tc=card(h.s,h.i); if(!tc) return; const [x1,y1]=cardCenter(tc);
        const p=document.createElement('div'); p.className='proj'+(sk.el==='bolt'?' bolt':''); p.style.setProperty('--c',EL[sk.el].c); p.style.left=x0+'px'; p.style.top=y0+'px';
        if(sk.el==='bolt') p.style.rotate=(Math.atan2(y1-y0,x1-x0)*180/Math.PI+90)+'deg';
        document.body.appendChild(p);
        setTimeout(()=>{ p.style.transform=`translate(${x1-x0}px,${y1-y0}px)`; },140);
        setTimeout(()=>p.remove(),470); });
    } else T = sk.pow?200:260;
  }
  // impacts
  let after=0;
  evs.forEach((e,k)=>{
    if(e.k==='act') return;
    const isTurnStart = actIdx>=0 && e.k!=='hit' && e.k!=='heal' && e.k!=='buff';
    const delay = (e.k==='dot'||e.k==='stun') ? T+520+after : T + (e.k==='hit'? (k-actIdx-1)*90 : 60);
    if(e.k==='dot'||e.k==='stun') after+=160;
    setTimeout(()=>{
      const el=card(e.s,e.i); if(!el) return;
      const f=document.createElement('span'); f.className='float '+e.k+(e.crit?' crit':'');
      f.textContent = e.k==='heal'?`+${e.v}`: e.k==='buff'?BUFF_N[e.b]: e.k==='stun'?'Stunned':`-${e.v}${e.crit?'!':''}`;
      if(e.k==='hit'||e.k==='dot'){
        f.style.color=EL[e.el]?EL[e.el].c:'';
        el.classList.remove('shake','hitflash'); void el.offsetWidth; el.classList.add('shake','hitflash');
        if(e.k==='hit'){ const [x,y]=cardCenter(el); const bu=document.createElement('div'); bu.className='burst'; bu.style.setProperty('--c',EL[e.el]?EL[e.el].c:'#fff'); bu.style.left=x+'px'; bu.style.top=y+'px'; document.body.appendChild(bu); setTimeout(()=>bu.remove(),460); }
        if(e.eff==='up'){ const x=document.createElement('span'); x.className='eff'; x.textContent='Super effective!'; el.appendChild(x); }
        if(e.crit) { root.classList.remove('quake'); void root.offsetWidth; root.classList.add('quake'); }
      }
      if(e.k==='heal'){ for(let n=0;n<6;n++){ const s=document.createElement('i'); s.className='sparkle'; s.style.left=(15+Math.random()*70)+'%'; s.style.animationDelay=(n*0.07)+'s'; el.appendChild(s); setTimeout(()=>s.remove(),1300);} }
      if(e.k==='buff'){ const r=document.createElement('i'); r.className='ring'; r.style.setProperty('--c', e.b==='bubble'?'#22a6e3':e.b==='thorns'?'#f7b500':e.b==='atkUp'?'#ff9f0a':e.b==='defUp'?'#a2845e':'#5e8bff'); el.appendChild(r); setTimeout(()=>r.remove(),750); }
      el.appendChild(f);
      syncCard(b,e.s,e.i);
    }, delay);
  });
  // final sync of every card
  setTimeout(()=>{ b.sides.forEach((sd,s)=>sd.mons.forEach((m,i)=>syncCard(b,s,i))); }, T+520+after+60);
  if(!animating) b.sides.forEach((sd,s)=>sd.mons.forEach((m,i)=>syncCard(b,s,i)));
  B.prev={}; b.sides.forEach((sd,s)=>sd.mons.forEach((m,i)=>{ B.prev[s+'-'+i]={hp:m.hp,mp:m.mp}; }));
}
function syncCard(b,s,i){
  const el=document.querySelector(`#battle .bmon[data-s="${s}"][data-i="${i}"]`); if(!el||!B||B.b!==b) return;
  const m=b.sides[s].mons[i]; const bars=el.querySelectorAll('.bar i');
  if(bars[0]) bars[0].style.width=Math.max(0,m.hp/m.maxhp*100)+'%';
  if(bars[1]) bars[1].style.width=Math.max(0,m.mp/m.maxmp*100)+'%';
  const n=el.querySelector('.bnum'); if(n) n.textContent=`${m.hp}/${m.maxhp}`;
  el.classList.toggle('ko', m.hp<=0);
}

  TASKSH={sh,zi}; drawTasks();

}
function drawTasks(){

  const st=monStats(m); const tl=taskList(zi), pr=taskProg(zi);

      <div class="thcol"><div class="hbar energy"><span class="ico">⚡</span><div class="ebar"><i style="width:${S.energy/S.maxEnergy*100}%"></i><b>${S.energy<S.maxEnergy?`+1 in ${nextEnergyIn()} · `:''}${S.energy} / ${S.maxEnergy}</b></div></div>
      <div class="hrow"><div class="hbar cash"><span class="ico c">$</span><b>${S.cash|0}</b></div><div class="hbar shrooms"><span class="ico m">${mushroomSVG('#b04fd6')}</span><b>${S.mush}</b></div></div></div>

    <div class="tlist">${tl.map((t,k)=>{

        <div class="t-grid">

function doTask(zi,k){
  const t=taskList(zi)[k]; const m=monBy(S.zoneMon)||teamMons()[0];
  if(!spend(t.en)){ drawTasks(); return; }
  { const pr0=taskProg(zi); if(pr0[k]>=t.reps) pr0[k]=0; }
  if(t.t==='act'){
    const pr=taskProg(zi); pr[k]=Math.min(t.reps,pr[k]+1);
    if(pr[k]<t.reps){ persist(); drawTasks(); renderHUD(); const tk=document.querySelectorAll('.tasks .task')[k]; if(tk){ tk.classList.add('bump'); setTimeout(()=>tk.classList.remove('bump'),450); } return; }
    S.cash=(S.cash|0)+t.cash; const all=teamXp(t.xp,m); const r=all[0].r;
    persist(); drawTasks(); renderHUD();
    rewardPopup({title:'SUCCESS!', cash:t.cash, xp:t.xp, mons:all, onClose:afterTaskTut});
    return;
  }
  persist();
  const z=ZONES[zi]; let foe;
  if(t.special==='dummy') foe={name:'Straw Dummy', mons:[{sp:'strawdum',lvl:1,hpMul:.8}]};
  else if(t.special==='jay') foe={name:'Jay', mons:[{sp:'rival_jay',lvl:t.lv,hpMul:.75}]};
  else if(t.special==='bob') foe={name:'Bob', mons:[{sp:'rival_bob',lvl:t.lv,hpMul:.75}]};
  else if(t.special==='grad') foe={name:'Jay & Bob', mons:[{sp:'rival_jay',lvl:t.lv,hpMul:.7},{sp:'rival_bob',lvl:t.lv,hpMul:.7}]};
  else { const fam=SP.filter(s=>s.fam===z.fam); const pick=fam[Math.floor(Math.random()*fam.length)];
    if(t.t==='boss'){ const bz=typeof ZBOSS!=='undefined'&&ZBOSS[z.id]; foe={name:zi===0?"Lila's Mossbug":bz?SPI[bz].n:`${z.n} Boss`, mons:[{sp: zi===0?'mossbug':bz||fam[3].id, lvl:t.lv+1, hpMul: zi===0?.85:1.35, skl: zi===0?{feedback:1,leech:1,feed:1,roots:1}:undefined}]}; }
    else foe={name:'Wild '+pick.n, mons:[{sp:pick.id, lvl:t.lv, hpMul: zi===0?.75:1}]}; }
  const b=newBattle({name:S.name, mons:[snapOf(m)]}, foe, {mode:'campaign'});
  B={b, mode:'campaign', meta:{zi, task:k, uid:m.uid}, mySide:0, ctl:['human','ai'], tgt:{}};
  openBattle(); NET.updatePresence(); drive();
  if(S.tut===3){ setTimeout(async()=>{ B&&(B.paused=true); await lilaSay(["It's your first battle! Every monster has its own abilities.","Tap an ability to see what it does. Swipe it UP to cast it!"],{last:'OK'}); if(B){ B.paused=false; drive(); } },500); }
}

// ===== battle start (arena modes) =====
function startBattle({mode, foe, meta, myName}){
  const b=newBattle({name:myName||S.name, mons:mySnap()}, foe, {mode});
  B={b, mode, meta:meta||{}, mySide:0, ctl:['human', mode==='local'?'human':'ai'], tgt:{}};
  openBattle(); NET.updatePresence(); drive();
}
function drive(){
  if(!B) return; const b=B.b;
  clearTimeout(B.timer);
  renderBattle();
  if(!b||B.paused) return;
  if(b.over){ if(!B.finished){ B.finished=true; B.timer=setTimeout(finishBattle, 1300); } return; }
  const a=actor(b); const c=B.ctl[a.s];
  if(c==='ai' || (c==='human' && B.auto && !(B.net&&B.net.role==='guest'&&B.net.sent===b.seq))){
    B.timer=setTimeout(()=>{ if(!B||B.b!==b||B.paused) return;
      if(B.net && B.net.role==='guest'){ NET.sendAction(aiChoose(JSON.parse(JSON.stringify(b)))); renderBattle(); return; }
      act(b, aiChoose(b)); afterAct(); }, c==='ai'?1500:(B.autoKick?(B.autoKick=0,200):900));
  }
}

function castTarget(a, id){
  const b=B.b; const t=SK[id].t;
  if(t==='enemy'){ const ts=1-a.s; const vt=validTargets(b,a.s,id); const sel=B.tgt[ts]; return vt.includes(sel)?sel:vt[0]; }
  if(t==='ally'){ let best=null,bp=2; b.sides[a.s].mons.forEach((m,i)=>{ if(m.hp>0 && m.hp/m.maxhp<bp){ bp=m.hp/m.maxhp; best=i; } }); return best; }
  return null;
}
function bindAbility(btn,a){
  const id=btn.dataset.sk; let y0=null, moved=false;
  btn.addEventListener('pointerdown',e=>{ if(btn.disabled) return; y0=e.clientY; moved=false; btn.classList.add('press'); try{btn.setPointerCapture(e.pointerId);}catch(_){} });
  btn.addEventListener('pointermove',e=>{ if(y0==null) return; const dy=e.clientY-y0; if(dy<-6){ moved=true; btn.style.transform=`translateY(${Math.max(-90,dy)}px)`; } });
  const up=e=>{ if(y0==null) return; const dy=e.clientY-y0; y0=null; btn.classList.remove('press'); btn.style.transform='';
    if(dy<-45){ hideInfo(); humanAct(id, castTarget(a,id)); }
    else if(!moved) showInfo(id,a); };
  btn.addEventListener('pointerup',up); btn.addEventListener('pointercancel',()=>{ y0=null; btn.style.transform=''; btn.classList.remove('press'); });
}
function showInfo(id,a){
